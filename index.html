<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>First Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Deliberate single theme: the current Primum CCS layout — white page, grey header tiles, blue-grey chart panel. */
:root{
  --bg:#ffffff; --ink:#1a1a1a; --muted:#5b5b5b; --tile:#e4e4e4; --tile-on:#b8c6d8; --tile-line:#c8c8c8;
  --panel:#c9d6e3; --panel-line:#9fb0c3; --field:#ffffff; --zebra:#eceff3; --tab:#e8e8e8; --line:#bdbdbd;
  --blue:#1a3f8f; --alert:#a40000; --good:#1d6b2a; --pend:#7a5a00; --sel:#2b5aa6; --sel-ink:#ffffff;
  --ui:"Segoe UI",Tahoma,Arial,Helvetica,sans-serif; --mono:Consolas,"Courier New",monospace;
  --fs:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--fs);line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.reverse{filter:invert(1) hue-rotate(180deg)} body.reverse svg{filter:invert(1) hue-rotate(180deg)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.btn{background:#f4f4f4;border:1px solid #8a8a8a;border-radius:2px;padding:4px 12px;cursor:pointer;color:#000;min-width:72px}
.btn:hover{background:#e9e9e9}
.btn:active{background:#d8d8d8}
.btn:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.btn:disabled{color:#9a9a9a;cursor:default;background:#f4f4f4}
.btn.def{border-color:#2b5aa6;box-shadow:inset 0 0 0 1px #2b5aa6}
input[type=text],select{background:var(--field);border:1px solid #8a8a8a;border-radius:2px;padding:4px 6px;width:100%}
input[type=text]:focus,select:focus{outline:2px solid var(--sel);outline-offset:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.small{font-size:.86em;color:var(--muted)}
a{color:var(--blue)}

/* Top line */
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 6px 8px}
.topline .allot{color:var(--blue);font-weight:600;font-size:1.1em;flex:1 1 300px;text-align:center;min-width:0}
.topline .row .btn{padding:3px 10px;font-size:.92em;min-width:0}

/* Header tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px}
@media (max-width:900px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--tile);border:1px solid var(--tile-line);border-radius:3px;padding:10px 12px;display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;min-height:100px}
.tile:hover{filter:brightness(.97)}
.tile.on{background:var(--tile-on)}
.tile .ico{flex:0 0 76px;height:76px;display:flex;align-items:center;justify-content:center}
.tile .ico svg{width:72px;height:72px;display:block}
.tile .txt{min-width:0}
.tile .txt b{display:block;font-weight:700;margin-top:6px}
.tile .txt span{display:block;font-size:1.02em}

/* Tabs */
.tabs{display:flex;gap:4px;padding:10px 0 0 4px;flex-wrap:wrap}
.tab{background:var(--tab);border:1px solid var(--line);border-bottom:0;padding:5px 14px;font-weight:700;cursor:pointer;border-radius:3px 3px 0 0}
.tab.on{background:#fff;color:#000;position:relative;top:1px}
.tab .cnt{color:var(--alert);font-weight:600;font-size:.85em}

/* Chart panel */
.panel{background:var(--panel);border:1px solid var(--panel-line);padding:6px 6px 10px}
.panel .ptitle{font-weight:700;padding:4px 2px 8px}
.sheet{background:var(--field);border:1px solid var(--panel-line);min-height:380px;max-height:62vh;overflow:auto}
table.os{width:100%;border-collapse:separate;border-spacing:0;font-size:1em}
table.os th{text-align:left;background:#f5f6f8;border-bottom:1px solid #c9c9c9;border-right:1px solid #e0e0e0;padding:6px 10px;position:sticky;top:0;font-weight:700}
table.os td{padding:6px 10px;border-right:1px solid #e0e0e0;border-bottom:1px solid #e9e9e9;vertical-align:top}
table.os tr:nth-child(even) td{background:var(--zebra)}
table.os tr.pending{cursor:pointer}
table.os tr.pending:hover td{background:#dfe8f5}
.st-pend{color:var(--pend)} .st-done{color:var(--good)} .st-na{color:var(--alert)}
.panel .foot{display:flex;justify-content:center;padding-top:10px}
.panel .foot .btn{min-width:110px;padding:6px 20px;font-weight:600}
.note{padding:8px 10px;border-bottom:1px solid #e3e3e3}
.note:nth-child(even){background:#f7f8fa}
.note .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9em}
.note .hd b{color:#000;font-size:1.1em}
.note .tx{margin-top:3px;white-space:pre-wrap}
.note.update{background:#fff6d6}
.note .fig{margin-top:8px;border:1px solid #888;background:#000;max-width:420px}
.note .fig svg{display:block;width:100%;height:auto}
.note .cap{font-size:.86em;color:var(--muted);margin-top:3px}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 20px;padding:10px}
.vit div{display:flex;justify-content:space-between;border-bottom:1px dotted #bbb;padding:3px 0}
.statusbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 6px 0;font-size:.95em}

/* Dialogs */
.modal-bg{position:fixed;inset:0;background:rgba(40,50,70,.35);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid #6d7a8a;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.dlg .tb{background:#dfe6ee;border-bottom:1px solid #b9c4d0;padding:7px 12px;font-weight:700}
.dlg .body{padding:12px 14px}
.dlg p{margin-bottom:10px}
.dlg .btns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.group{border:1px solid #c3c3c3;padding:12px 10px 10px;position:relative;margin-top:10px;border-radius:2px}
.group>legend,.group .lg{padding:0 4px;font-weight:600}
.radio{display:flex;flex-direction:column;gap:7px}
.radio label,.chk label{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:5px 12px}
.inl{display:inline-flex;gap:6px;align-items:center}
.inl input[type=text]{width:64px;text-align:right}
.inl select{width:auto}
.listbox{background:var(--field);border:1px solid #8a8a8a;max-height:200px;overflow:auto;margin-top:3px}
.listbox div{padding:4px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.listbox div.hl,.listbox div:hover{background:var(--sel);color:var(--sel-ink)}
.listbox .cat{font-size:.86em;opacity:.85;white-space:nowrap}
.qlist{border:1px solid #c3c3c3;margin-top:8px}
.qlist .qi{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid #e5e5e5}
.qlist .qi select{width:auto;padding:2px 4px}
.qlist .qi .rm{border:0;background:transparent;color:var(--alert);cursor:pointer;font-weight:700}

/* Start, test, feedback */
.win{max-width:1000px;margin:0 auto}
.start h1{font-size:1.6em;color:var(--blue);margin-bottom:6px}
.caselist{border:1px solid #8a8a8a;background:#fff;max-height:380px;overflow:auto}
.caselist button{width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #eee}
.caselist button:hover{background:#eef2f8} .caselist button.sel{background:var(--sel);color:var(--sel-ink)}
.caselist .n{font-family:var(--mono);font-size:.9em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.fb div{background:#f5f6f8;border:1px solid #c9c9c9;padding:6px 10px;font-size:.9em}
.fb b{display:block;font-size:1.6em;font-family:var(--mono)}
.list{border:1px solid #c9c9c9;background:#fff;margin-bottom:4px}
.list .it{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;padding:5px 8px;border-bottom:1px solid #eee;align-items:start}
.list .it .m{font-weight:700;font-family:var(--mono)}
.ok .m{color:var(--good)} .late .m{color:var(--pend)} .miss .m,.harm .m{color:var(--alert)}
.list .why{font-size:.88em;color:var(--muted)}
.list .when{font-family:var(--mono);font-size:.88em;white-space:nowrap;color:var(--muted)}
.list ul{margin:0;padding:6px 8px 6px 26px} .list li{margin:4px 0}
.oncall{padding:8px 10px;background:#fff6d6;border-top:1px solid #d0c080}
.q{padding:8px 10px;border-bottom:1px solid #e5e5e5}
.q .stem{font-weight:600;margin-bottom:4px}
.q .opt{display:block;width:100%;text-align:left;border:0;background:transparent;padding:3px 6px;cursor:pointer}
.q .opt:hover{background:#eef2f8}
.q .opt.right{background:#d8f0d8} .q .opt.wrong{background:#f6d6d6}
.q .expl{font-size:.88em;color:var(--muted);margin-top:4px}
.sunk{border:1px solid #c9c9c9;background:#fff}
</style>

<div id="app"></div>
<script>
/* ---------- SVG schematic generators ---------- */
const SVG = {};
SVG.fundus = function(o){
  o = o||{}; const od = o.eye!=='OS';
  const dx = od? 215:85; // disc x (OD disc on right)
  const mx = od? 130:170; // macula x
  const W=300,H=300;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="fundus schematic">
  <defs><radialGradient id="fg${od}" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="${o.pale?'#f0c9a8':'#d9682c'}"/><stop offset="1" stop-color="${o.pale?'#d9a884':'#9b3a16'}"/></radialGradient>
  <radialGradient id="dg"><stop offset="0" stop-color="${o.discPale?'#fff7ea':'#ffd9a8'}"/><stop offset="1" stop-color="${o.discPale?'#f3e6d4':'#f0a865'}"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="#111"/>
  <circle cx="150" cy="150" r="145" fill="url(#fg${od})"/>`;
  // vessels
  const vs = [[-1,-1],[-1,1],[1,-1],[1,1]];
  const dir = od? -1:1;
  vs.forEach(([a,b],i)=>{
    const x2 = dx + dir*Math.abs(a)*120*(a>0? 1:1)* (i<2? 1:0.35), y2 = 150 + b*120;
    const cx1 = dx + dir*40, cy1 = 150 + b*20;
    const stroke = o.boxcar? `stroke-dasharray="7 5"`:'';
    s += `<path d="M${dx} 150 Q${cx1} ${cy1} ${od? (a<0? dx-120: dx+30): (a<0? dx-30: dx+120)} ${y2}" fill="none" stroke="#8a1414" stroke-width="${i<2?4:3}" ${stroke} stroke-linecap="round"/>`;
    s += `<path d="M${dx} 150 Q${cx1} ${cy1} ${od? (a<0? dx-110: dx+28): (a<0? dx-28: dx+110)} ${y2+ b*8}" fill="none" stroke="#c23b2b" stroke-width="2" ${stroke} stroke-linecap="round"/>`;
  });
  // detachment
  if(o.rd){
    const q = o.rd.quadrant||'sup-temp';
    const sup = q.startsWith('sup'); const temp = q.endsWith('temp');
    const left = od? temp : !temp;
    const x0 = left? 10:150, y0 = sup? 10:150;
    const big = o.rd.macOff;
    s += `<path d="M${left? 10:290} ${sup? 60:240} C ${left? 60:240} ${sup? 40:260}, ${left? 120:180} ${sup? (big?170:120):(big?130:180)}, ${left? (big?205:150):(big?95:150)} ${sup? (big?150:95):(big?150:205)} C ${left? 160:140} ${sup? 60:240}, ${left? 100:200} ${sup? 10:290}, ${left? 60:240} ${sup? 10:290} Z" fill="#9aa6b8" opacity=".78"/>
    <path d="M${left? 40:260} ${sup? 70:230} q 30 ${sup? -15:15} 60 ${sup? 20:-20} q 20 ${sup? 25:-25} 40 ${sup? 5:-5}" fill="none" stroke="#e8edf5" stroke-width="2" opacity=".7"/>`;
    // tear
    const tx = left? 50:250, ty = sup? 45:255;
    s += `<path d="M${tx-8} ${ty+ (sup?8:-8)} q 8 ${sup?-16:16} 16 0" fill="#9b1b1b" stroke="#5a0b0b" stroke-width="1.5"/>`;
  }
  // macula / cherry red
  if(o.cherry){
    s += `<circle cx="${mx}" cy="150" r="48" fill="#f3e3d2" opacity=".85"/><circle cx="${mx}" cy="150" r="9" fill="#b3261e"/>`;
  } else {
    s += `<circle cx="${mx}" cy="150" r="26" fill="#8f2e12" opacity=".55"/><circle cx="${mx}" cy="150" r="4" fill="#5a1508"/>`;
  }
  if(o.hemes){ for(let i=0;i<o.hemes;i++){ const a=i*2.1, r=50+ (i*37)%70; const hx=dx+Math.cos(a)*r*(.6), hy=150+Math.sin(a)*r; s += `<path d="M${hx} ${hy} l${6+(i%3)*3} ${2-(i%2)*4} l-3 5 z" fill="#7a0e0e"/>`; } }
  // disc
  const dr = o.discEdema? 34:26;
  if(o.discEdema) s += `<circle cx="${dx}" cy="150" r="${dr+10}" fill="${o.discPale?'#f6ead9':'#f0b074'}" opacity=".55"/>`;
  s += `<circle cx="${dx}" cy="150" r="${dr}" fill="url(#dg)" stroke="${o.discEdema?'none':'#c98447'}" stroke-width="1.5"/>`;
  if(o.discEdema){ s+= `<path d="M${dx-dr-6} ${150-10} l8 3 l-5 6 z M${dx+dr+2} ${150+8} l7 2 l-4 6 z M${dx-4} ${150-dr-8} l8 1 l-5 6 z" fill="#7a0e0e"/>`; }
  const cup = o.cup==null? .3 : o.cup;
  if(!o.discEdema) s += `<circle cx="${dx+ (od? 2:-2)}" cy="150" r="${dr*cup}" fill="#fff1d8" opacity=".9"/>`;
  if(o.hazy) s += `<rect width="${W}" height="${H}" fill="#e9d3bb" opacity="${o.hazy}"/>`;
  s += `<text x="10" y="290" font-family="monospace" font-size="12" fill="#eee">${od?'OD':'OS'}</text></svg>`;
  return s;
};

SVG.slit = function(o){
  o=o||{}; const W=300,H=200, cx=150, cy=100;
  const cobalt = o.cobalt;
  const pupil = o.pupil==null? 3.5 : o.pupil; const pr = pupil*6;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="slit lamp schematic">
  <rect width="${W}" height="${H}" fill="${cobalt?'#0b1e5c':'#1a1a1a'}"/>
  <ellipse cx="${cx}" cy="${cy}" rx="140" ry="78" fill="${cobalt?'#243f8f':(o.injection? '#f1c9c2':'#f4efe8')}"/>`;
  // conjunctival vessels
  if(o.injection && !cobalt){ for(let i=0;i<14;i++){ const y = 40+i*9; const dirn = i%2? 1:-1; s += `<path d="M${cx+dirn*68} ${y} q ${dirn*30} ${(i%3-1)*6} ${dirn*62} ${(i%2)*4}" stroke="#c0392b" stroke-width="${o.injection>1?1.6:1}" fill="none" opacity=".8"/>`; } }
  if(o.chemosis && !cobalt) s += `<ellipse cx="${cx}" cy="${cy}" rx="120" ry="66" fill="#f7d6cf" opacity=".6"/>`;
  // ciliary flush
  if(o.flush && !cobalt) s += `<circle cx="${cx}" cy="${cy}" r="66" fill="none" stroke="#c74a3a" stroke-width="8" opacity=".55"/>`;
  // iris
  const irisC = cobalt? '#1b2d6b' : (o.iris||'#6b4a2b');
  s += `<circle cx="${cx}" cy="${cy}" r="60" fill="${irisC}"/>`;
  if(!cobalt){ for(let i=0;i<36;i++){ const a=i*10*Math.PI/180; s += `<line x1="${cx+Math.cos(a)*(pr+2)}" y1="${cy+Math.sin(a)*(pr+2)}" x2="${cx+Math.cos(a)*58}" y2="${cy+Math.sin(a)*58}" stroke="#3b2a18" stroke-width="1" opacity=".5"/>`; } }
  // pupil
  if(o.peaked){ s += `<path d="M${cx-pr} ${cy} a${pr} ${pr} 0 1 0 ${pr*2} 0 L${cx+pr*0.9} ${cy-pr*2.1} Z" fill="#050505"/>`; }
  else s += `<circle cx="${cx}" cy="${cy}" r="${pr}" fill="#050505"/>`;
  // hyphema / hypopyon
  if(o.hypopyon){ const h = 60*o.hypopyon; s += `<clipPath id="ir"><circle cx="${cx}" cy="${cy}" r="60"/></clipPath><rect x="${cx-60}" y="${cy+60-h*2}" width="120" height="${h*2}" fill="#f4efd8" clip-path="url(#ir)" opacity=".95"/>`; }
  if(o.hyphema){ const h = 60*o.hyphema; s += `<clipPath id="ir2"><circle cx="${cx}" cy="${cy}" r="60"/></clipPath><rect x="${cx-60}" y="${cy+60-h*2}" width="120" height="${h*2}" fill="#8b0d0d" clip-path="url(#ir2)" opacity=".95"/>`; }
  // corneal haze
  if(o.haze) s += `<circle cx="${cx}" cy="${cy}" r="66" fill="#dfe6ef" opacity="${o.haze}"/>`;
  // laceration + prolapse
  if(o.lac){ s += `<path d="M${cx+10} ${cy-62} L${cx+28} ${cy-30}" stroke="${cobalt?'#9ff06a':'#e9e9e9'}" stroke-width="3" stroke-linecap="round"/>`; if(!cobalt) s += `<ellipse cx="${cx+20}" cy="${cy-45}" rx="7" ry="4" fill="#3b2a18" transform="rotate(60 ${cx+20} ${cy-45})"/>`; }
  // fluorescein (cobalt) defect
  if(cobalt && o.defect){ s += `<path d="M${cx-40} ${cy-20} q 30 -35 70 -5 q 25 30 -5 55 q -40 20 -65 -10 z" fill="#b8ff3a" opacity=".85"/>`; }
  if(cobalt && o.seidel){ s += `<path d="M${cx+22} ${cy-40} q 10 30 -5 70 q 30 -20 40 10" fill="none" stroke="#d9ff57" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M${cx+22} ${cy-40} q 10 30 -5 70" fill="none" stroke="#0b1e5c" stroke-width="2" opacity=".6"/>`; }
  if(cobalt && o.pee){ s += `<g fill="#b8ff3a" opacity=".8">${Array.from({length:40},(_,i)=>`<circle cx="${cx-50+(i*37)%100}" cy="${cy-45+(i*53)%90}" r="1.6"/>`).join('')}</g>`; }
  if(o.limbalIsch){ s += `<path d="M${cx-62} ${cy-10} a62 62 0 0 1 20 -45" fill="none" stroke="#f6f1ea" stroke-width="9" stroke-linecap="round"/>`; }
  // slit beam
  if(!cobalt) s += `<rect x="${cx-24}" y="${cy-70}" width="4" height="140" fill="#ffffff" opacity=".75"/>`;
  if(o.lidSwell) s += `<path d="M10 ${cy-30} Q${cx} ${cy-115} 290 ${cy-30} L290 0 L10 0 Z" fill="${cobalt?'#101a3a':'#e2a08c'}"/>`;
  s += `<text x="10" y="190" font-family="monospace" font-size="12" fill="#ddd">${o.eye||'OD'}${cobalt?' · cobalt blue':''}</text></svg>`;
  return s;
};

SVG.external = function(o){
  o=o||{}; const W=320,H=130;
  const eye = (x, side)=>{
    const prop = (o.proptosis===side)? 10:0, swell = (o.lidSwell===side), red=(o.erythema===side);
    const ptosis = (o.ptosis===side)? 28:0;
    const dev = (o.deviation===side)? {dx:14,dy:12}:{dx:0,dy:0};
    const sz = (o.pupil && o.pupil[side])||3.5;
    let e = '';
    if(swell) e += `<ellipse cx="${x}" cy="60" rx="62" ry="${48+prop}" fill="${red?'#e2897a':'#e8b9a8'}" opacity=".9"/>`;
    e += `<path d="M${x-50} 65 Q${x} ${15+ptosis-prop} ${x+50} 65 Q${x} ${105+prop} ${x-50} 65 Z" fill="#fff"/>`;
    e += `<circle cx="${x+dev.dx}" cy="${65+dev.dy}" r="${18+prop*.4}" fill="#6b4a2b"/><circle cx="${x+dev.dx}" cy="${65+dev.dy}" r="${sz*2}" fill="#000"/>`;
    if(ptosis) e += `<path d="M${x-52} 64 Q${x} ${15+ptosis} ${x+52} 64 L${x+52} 10 L${x-52} 10 Z" fill="#e8c4ad"/>`;
    e += `<path d="M${x-50} 65 Q${x} ${15+ptosis-prop} ${x+50} 65" fill="none" stroke="#3a2a1a" stroke-width="2.5"/>`;
    return e;
  };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="external schematic"><rect width="${W}" height="${H}" fill="#e8c4ad"/>`;
  s += eye(90,'OD') + eye(230,'OS');
  s += `<text x="80" y="122" font-family="monospace" font-size="11" fill="#333">OD (patient right)</text><text x="222" y="122" font-family="monospace" font-size="11" fill="#333">OS</text></svg>`;
  return s;
};

SVG.pupils = function(o){
  o=o||{}; const W=320,H=110;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="pupils"><rect width="${W}" height="${H}" fill="#1a1a1a"/>${d(90,o.od||4,'OD',o.apd==='OD')}${d(230,o.os||4,'OS',o.apd==='OS')}<text x="160" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#999">${o.light||'room light'}</text></svg>`;
};

SVG.oct = function(o){
  o=o||{}; const W=320,H=150;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="OCT macula"><rect width="${W}" height="${H}" fill="#000"/>`;
  const pit = o.srf? 0 : 22;
  const base = 70;
  const layer=(off,col,w)=>`<path d="M0 ${base+off} C 100 ${base+off}, 130 ${base+off}, 160 ${base+off+pit*(off<30?1:0.4)} C 190 ${base+off}, 220 ${base+off}, 320 ${base+off}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
  s += layer(0, o.innerHyper? '#f4f4f4':'#d8d8d8', o.innerHyper? 10:3);
  s += layer(12,'#8a8a8a',6); s += layer(26,'#b5b5b5',3); s += layer(36,'#7a7a7a',6);
  if(o.edema){ s += `<ellipse cx="130" cy="${base+20}" rx="16" ry="9" fill="#000" stroke="#999"/><ellipse cx="190" cy="${base+18}" rx="12" ry="8" fill="#000" stroke="#999"/>`; }
  // RPE
  const rpeY = base+52;
  if(o.srf){ s += `<path d="M0 ${rpeY} C 80 ${rpeY}, 120 ${rpeY+30}, 160 ${rpeY+30} C 200 ${rpeY+30}, 240 ${rpeY}, 320 ${rpeY}" fill="none" stroke="#f0f0f0" stroke-width="4"/>`; s += `<path d="M60 ${rpeY-10} C 100 ${rpeY-10}, 130 ${rpeY+6}, 160 ${rpeY+6} C 190 ${rpeY+6}, 220 ${rpeY-10}, 260 ${rpeY-10}" fill="none" stroke="#111" stroke-width="12"/>`; }
  else s += `<path d="M0 ${rpeY} L320 ${rpeY}" stroke="#f0f0f0" stroke-width="4"/>`;
  s += `<path d="M0 ${rpeY+14} L320 ${rpeY+14}" stroke="#444" stroke-width="10" opacity=".7"/>`;
  s += `<text x="8" y="140" font-family="monospace" font-size="11" fill="#aaa">OCT macula · ${o.eye||'OD'} · horizontal B-scan</text></svg>`;
  return s;
};

SVG.bscan = function(o){
  o=o||{}; const W=320,H=200;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="B-scan"><rect width="${W}" height="${H}" fill="#000"/>
  <path d="M20 20 L300 20 L240 190 L80 190 Z" fill="#141414"/>

  return s;
};

SVG.ct = function(o){
  o=o||{}; const W=320,H=220;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CT orbits axial"><rect width="${W}" height="${H}" fill="#000"/>
  <path d="M30 210 Q 160 -60 290 210 Z" fill="#6a6a6a"/>
  <path d="M60 210 Q160 -20 260 210 Z" fill="#2a2a2a"/>
  <path d="M135 90 L160 30 L185 90 Z" fill="#8a8a8a"/>
  <rect x="150" y="90" width="20" height="100" fill="#777"/>`;
  const globe=(x,side)=>{ const isR = side==='OD'; const rupt = o.rupture===side; const prop = o.proptosis===side? -10:0;
    let g = `<ellipse cx="${x}" cy="${110+prop}" rx="${rupt?34:36}" ry="${rupt?28:36}" fill="#1b1b1b" stroke="#bdbdbd" stroke-width="2"/><ellipse cx="${x}" cy="${80+prop}" rx="12" ry="5" fill="#cfcfcf"/>`;
    if(o.abscess===side){ const ax = isR? x+42 : x-42; g += `<path d="M${ax} 70 Q ${isR? ax+16: ax-16} 110 ${ax} 150 Q ${isR? ax-8: ax+8} 110 ${ax} 70 Z" fill="#9c9c9c"/>`; }
    if(o.sinus) { g += `<rect x="${isR? x+30: x-62}" y="150" width="32" height="40" fill="#888" opacity=".8"/>`; }
    if(o.fb===side) g += `<circle cx="${x+6}" cy="${118+prop}" r="4" fill="#fff"/><g stroke="#fff" opacity=".6"><line x1="${x+6}" y1="${100}" x2="${x+6}" y2="${140}"/><line x1="${x-12}" y1="${118}" x2="${x+24}" y2="${118}"/></g>`;
    if(rupt) g += `<path d="M${x-20} ${90}  q 20 10 40 -4" fill="none" stroke="#e6e6e6" stroke-width="3"/>`;
    return g; };
  // patient's right on image left
  s += globe(100,'OD') + globe(220,'OS');
  s += `<text x="8" y="212" font-family="monospace" font-size="11" fill="#aaa">CT orbits · axial · R</text><text x="290" y="212" font-family="monospace" font-size="11" fill="#aaa">L</text></svg>`;
  return s;
};

SVG.hvf = function(o){
  o=o||{}; const W=220,H=240; const n=10, cell=20;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="visual field"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const dxr = c-4.5, dyr = r-4.5; if(Math.hypot(dxr,dyr)>5.2) continue;
    let v = 0.06;
    if(o.altitudinal==='inferior' && r>=5) v = .92; if(o.altitudinal==='superior' && r<5) v = .92;
    if(o.arcuate && r<5 && Math.hypot(dxr,dyr)>2.5 && Math.hypot(dxr,dyr)<5) v=.85;
    if(o.quadrant){ const [v1,h1]=o.quadrant.split('-'); if((v1==='sup'? r<5: r>=5) && (h1==='nasal'? (o.eye==='OS'? c>=5: c<5) : (o.eye==='OS'? c<5: c>=5))) v=.9; }
    if(o.blind) v=.9;
    s += `<rect x="${10+c*cell}" y="${10+r*cell}" width="${cell-1}" height="${cell-1}" fill="rgb(${Math.round(255-v*240)},${Math.round(255-v*240)},${Math.round(255-v*240)})"/>`;
  }
  s += `<text x="10" y="232" font-family="monospace" font-size="11" fill="#333">HVF 24-2 grayscale · ${o.eye||'OD'}</text></svg>`;
  return s;
};

 teaching:[
  'Diagnosis is clinical: pain, halos, mid-dilated fixed pupil, hazy cornea, shallow AC, IOP typically 40–80 mmHg. Nausea and headache get these patients triaged as migraine or GI — the eye exam is the tell.',
  'Break the attack medically first: topical beta-blocker + alpha-agonist + CAI, plus acetazolamide 500 mg (IV if vomiting). Mannitol if no response in an hour. Pilocarpine only works once IOP is below ~40 and the sphincter is perfused again.',
  'Never dilate. Check the fellow eye — it has the same anatomy and needs a prophylactic LPI.',
  'Definitive treatment is laser peripheral iridotomy once the cornea clears, usually next morning. Paracentesis is a bridge if medical therapy fails.',
  'Sulfa "allergy" from an antibiotic is not an absolute contraindication to acetazolamide; a true sulfonamide anaphylaxis is. Ask what the reaction was.',

 teaching:[
  'Sudden, painless, profound monocular vision loss with a dense APD and a cherry-red spot is CRAO. The ED often calls these "normal-looking eye" — the pathology is in the back.',
  'CRAO is a stroke equivalent (AHA 2021 scientific statement). Activate the stroke team immediately; roughly a quarter of patients have concurrent silent brain infarcts on DWI, and the short-term risk of a disabling stroke is highest in the first days.',
  'In anyone over 50, send ESR, CRP and platelets the same hour. Arteritic CRAO (GCA) is the one cause where you can save the other eye.',
  'Conservative "eye" measures (ocular massage, paracentesis, IOP lowering, rebreathing) have little evidence; they are acceptable while the stroke workup starts, not instead of it. Thrombolysis is institution-dependent and belongs to neurology.',

 dx:['gca'], dispo:['admit'], bestDispo:'admit',
 teaching:[
  'Over 50 with vision loss plus any of: new headache, jaw claudication, scalp tenderness, PMR symptoms, constitutional symptoms, or a preceding amaurosis episode — think GCA. Jaw claudication is the single most specific symptom.',
  'Arteritic AION looks different from NAION: chalky-white pallid edema, worse vision (often <20/200), a normal-sized cup in the fellow eye, and sometimes a cilioretinal artery occlusion alongside. NAION typically has hyperemic edema, a crowded fellow disc, and vision better than 20/200.',
  'Labs: ESR, CRP and platelets together. CRP is the most sensitive single test; a normal ESR does not exclude GCA. Thrombocytosis and normocytic anemia support it.',
  'Treat before you prove it. High-dose steroids (IV methylprednisolone 1 g/day × 3 if vision is lost, then prednisone 1 mg/kg) started immediately. Biopsy yield stays high for at least 2 weeks after steroids start.',
  'The goal is the fellow eye. Untreated, 25–50% lose vision in the second eye, often within days to weeks.',
 ],
 onCall:'Once the story has jaw claudication and a pale swollen disc, you don\'t wait for the ESR to come back. Call the attending with "arteritic AION, starting methylpred, admitting" — not with a question.',
 sources:[['EyeWiki: Giant cell arteritis','https://eyewiki.aao.org/Giant_Cell_Arteritis'],['AAO BCSC Section 5 — Neuro-Ophthalmology: Ischemic optic neuropathy','https://www.aao.org/education/bcsc'],['2021 ACR/VF Guideline for the Management of Giant Cell Arteritis','https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/art.41774']],
},

{
 id:'globe', tier:1, title:'Hammering metal', startLoc:'ED', startClock:19*60+50,
 patient:{label:'ED Trauma 2', age:34, sex:'M'},
 page:'ED resident: "34M was hammering a steel pin, felt something hit his right eye. Now has pain and blurry vision. There\'s some blood on the white of the eye. We haven\'t touched it. Need ophtho."',
 vitals:{BP:'138/84',HR:'92',T:'36.9',SpO2:'99%',Pain:'7/10'},
 results:{
  hx:'Striking a hardened steel pin with a hammer without eye protection about an hour ago. Felt a sharp sting, then immediate tearing, blurring and photophobia. Denies loss of consciousness. Last ate 2 hours ago (burger). Tetanus booster unknown, "maybe 10 years ago."',
  hx_meds:'No medications. NKDA. No prior eye surgery. Last tetanus unknown.',
  va:'VA sc: OD hand motion at 2 ft, OS 20/20.',
  pupils: s=> F('OD pupil peaked toward 2 o\'clock, 5 mm, poorly reactive. OS 4 mm, brisk. Reverse APD technique: OD likely has an APD, hard to grade.', SVG.pupils({od:5,os:4,apd:'OD'}), 'Peaked right pupil — think iris to a wound'),
  ext:'Mild right upper lid edema. No lid laceration. Orbital rims intact and non-tender.',
  sle: s=> F('OD: full-thickness corneal laceration about 3 mm at 1–2 o\'clock, paracentral, with a knuckle of iris plugging the wound. Anterior chamber shallow compared with OS; 1+ hyphema layering inferiorly. Pupil peaked toward the wound. Bullous subconjunctival hemorrhage inferotemporally. Lens: possible small anterior capsular defect. You stop here — no further pressure on the globe.', SVG.slit({injection:1,lac:true,peaked:true,pupil:5,hyphema:.1,eye:'OD'}), 'Corneal laceration with iris prolapse'),
  fluor: s=> F('Seidel POSITIVE: a stream of aqueous dilutes the fluorescein at the wound under cobalt blue.', SVG.slit({cobalt:true,lac:true,seidel:true,pupil:5,eye:'OD'}), 'Positive Seidel — aqueous leaking through the wound'),
  iop:'You applied a Tono-Pen to an open globe. Reading 4 mmHg. The iris prolapse looks larger afterward. Do not check IOP when an open globe is suspected.',
  ufe:'Hazy view through hyphema. Red reflex dull. Disc not clearly seen. (Stop manipulating the eye.)',
  dfe:'Dilating drops instilled — acceptable, but the view is poor through the hyphema and you should not be pressing on this eye with a lens. Vitreous hemorrhage suspected. The IOFB will show on CT.',
  bscan:'Technician pauses: "Open globe? I\'d rather not put a probe and gel on it." If performed gently over closed lids: vitreous hemorrhage and a highly reflective focus with shadowing in the posterior vitreous. (CT is the safer test.)',
  ct_orb: s=> F('CT orbits (1 mm cuts): 2 × 1 mm metallic-density foreign body in the posterior right vitreous near the retina, with streak artifact. Right globe slightly reduced in volume with a flattened anterior contour. Small amount of intraocular air. No orbital fracture. Left globe intact.', SVG.ct({fb:'OD',rupture:'OD'}), 'Metallic IOFB, flattened right globe'),
  mri:'MRI tech: "Hold on — the history says metal. We won\'t scan him." Correct call; you ordered an MRI with a possible metallic IOFB.',
  shield:'Rigid Fox shield taped to the brow and cheek. Nothing touches the eye.',
  patch:'A pressure patch was applied over an open globe, pushing intraocular contents toward the wound. Removed by the ED nurse 20 minutes later when he complained of worse pain.',
  npo:'NPO from now. Last meal at 18:00.',
  tetanus:'Tdap given.',
  antiemetic:'Ondansetron 4 mg IV given. Patient advised not to strain or bend.',
  analgesia:'IV fentanyl given. Pain 3/10.',
  ivabx:'Vancomycin 1 g IV + ceftazidime 1 g IV started (IOFB prophylaxis; some services use moxifloxacin or cefazolin + ciprofloxacin).',
  abx_drop:'Moxifloxacin drop instilled. (Avoid ointments with an open wound.)',
  attending: s=> anyGiven(s,['ct_orb'])? 'Attending: "Open globe with IOFB. Shield, NPO, tetanus, IV antibiotics, CT done — good. Book the OR tonight with the retina fellow; we\'ll close primarily and plan IOFB removal. I\'m coming in."' : 'Attending: "Sounds like an open globe. Shield it, NPO, tetanus, IV antibiotics, and get the thin-cut CT for the foreign body. Call me with the CT and I\'ll come in."',
  retina:'Retina fellow: "Metallic IOFB posterior — we\'ll plan primary closure tonight and vitrectomy with IOFB removal, either same sitting or within a few days depending on the view."',
  or_book:'OR posted: "Repair of open globe right eye, possible IOFB removal." Anesthesia aware NPO since 18:00; will use a non-depolarizing paralytic.',
  pred_drops:'Topical steroid instilled. Not harmful, but not a priority now.',
  cyclo:'Cycloplegic instilled.',
 },
 events:[
  {at:120, unless:['shield'], text:'Two hours and the eye is still unprotected. The patient rubbed it while nauseated; more iris is now visible at the wound.', penalty:8},

 ],
 critical:[
  {label:'Visual acuity',any:['va'],within:20,pts:4},
  {label:'Recognize the open globe (slit lamp ± Seidel)',any:['sle','fluor'],within:30,pts:10},
  {label:'Rigid shield — no patch',any:['shield'],within:30,pts:12},
  {label:'NPO',any:['npo'],within:60,pts:6},
  {label:'Tetanus status / booster',any:['tetanus'],pts:5},
  {label:'IV antibiotics',any:['ivabx'],within:120,pts:8},
  {label:'Antiemetic (prevent Valsalva)',any:['antiemetic'],pts:4},
  {label:'CT orbits thin cuts for IOFB (not MRI)',any:['ct_orb'],within:120,pts:12},
  {label:'Call attending',any:['attending'],within:60,pts:8},
  {label:'Book OR within 24 h',any:['or_book'],within:360,pts:10},
 ],
 harmful:[
  {label:'Checked IOP on an open globe',any:['iop'],pts:12,why:'Any pressure on the globe can extrude intraocular contents. Diagnose the open globe clinically; skip tonometry.'},
  {label:'Pressure patch',any:['patch'],pts:12,why:'A patch presses on the globe. Use a rigid shield.'},
  {label:'Ordered MRI with a suspected metallic foreign body',any:['mri'],pts:20,why:'A ferromagnetic IOFB can move in the magnet. CT is the test.'},
  {label:'B-scan with probe on an open globe',any:['bscan'],pts:6,why:'Avoid pressure on the eye; CT answers the question.'},
  {label:'Scleral depression',any:['depress'],pts:15,why:'Never depress an open globe.'},
 ],
 helpful:['hx','hx_meds','pupils','ext','ufe','dfe','abx_drop','analgesia','retina','cbc','bmp','coags','ekg','glucose','cyclo','pred_drops','eom','cvf','pinhole'],
 dx:['open_globe'], dispo:['or_now','or_24','admit'], bestDispo:'or_now',
 teaching:[
  'Metal-on-metal plus a peaked pupil, shallow AC, bullous subconjunctival hemorrhage, or a Seidel-positive wound = open globe. Stop the exam there; the rest happens in the OR.',
  'The protect-and-prepare list: rigid shield (never a patch), NPO, tetanus, IV antibiotics, antiemetic and analgesia, head of bed up, no straining. Document VA and pupil before anything else.',
  'CT orbits with thin (≤1 mm) cuts is the imaging of choice for IOFB. MRI is contraindicated until metal is excluded. B-scan is possible but means touching the eye.',
  'Repair within 24 hours; sooner is better. IOFB raises endophthalmitis risk (Bacillus cereus with soil contamination is the feared organism), which is why IV antibiotics start in the ED.',
  'Prognosis trackers (Ocular Trauma Score): initial VA, rupture, endophthalmitis, perforating injury, RD, APD.',
 ],
 onCall:'Say "open globe" out loud to the ED early so nobody checks a pressure or patches it while you walk over. Your first three calls are attending, OR desk, and anesthesia — in that order.',
 sources:[['EyeWiki: Open globe injury','https://eyewiki.aao.org/Open_Globe_Injury'],['EyeWiki: Intraocular foreign body','https://eyewiki.aao.org/Intraocular_Foreign_Body'],['Wills Eye Manual — Ruptured globe and penetrating ocular injury','https://www.wolterskluwer.com/en/solutions/ovid/the-wills-eye-manual-14286']],
},

{
 id:'orbcell', tier:1, title:'Swollen eye in a 9-year-old', startLoc:'ED', startClock:23*60+15,
 patient:{label:'Peds ED Bed 6', age:9, sex:'M'},
 page:'Peds ED: "9M with left eyelid swelling and redness ×1 day, fever to 38.9. Had a cold for a week. We\'re thinking preseptal vs orbital — can you help decide if he can go home on Augmentin?"',
 vitals:{BP:'108/66',HR:'112',T:'38.9',SpO2:'98%',Pain:'5/10'},
 results:{
  hx:'Seven days of nasal congestion and purulent rhinorrhea. Yesterday the left upper and lower lids began to swell and redden; today the eye "sticks out" per mother, he complains of pain when looking around, and he\'s had double vision at breakfast. Fever since last night. No trauma, no insect bite, no dental pain. Immunizations up to date.',
  hx_meds:'No medications. NKDA. Term birth, healthy.',
  va:'VA (Snellen, cooperative): OD 20/20, OS 20/30.',
  pupils: s=>{ const late = s.t>=360 && !given(s,'ivabx'); return F(late? 'OD 4 mm brisk. OS 4 mm with a new 1+ APD.' : 'OD 4 mm brisk. OS 4 mm brisk. No APD.', SVG.pupils({od:4,os:4,apd: late? 'OS':null}), late? 'A new APD — the nerve is now involved':'No APD'); },
  eom:'OS: abduction limited to about 60%, pain on all movements. Elevation mildly limited. OD full. Left esotropia in primary gaze on cover test.',

  hertel:'Hertel: 15 mm OD, 19 mm OS (base 92). 4 mm relative proptosis.',
  color:'Ishihara OD 14/14, OS 13/14.',
  sle:'OS: 2+ conjunctival injection and chemosis. Cornea clear. AC deep and quiet. OD normal.',
  iop:'IOP 14 OD, 20 OS (Tono-Pen, cooperative).',
  ufe:'OS: disc sharp, no edema, no venous congestion. OD normal.',
  dfe:'OS: sharp disc, normal vessels, no choroidal folds. OD normal.',
  cbc:'WBC 18.6 (82% neutrophils, bands 8%), Hgb 12.4, Plt 310.',
  crp:'CRP 9.2 mg/dL.', esr:'ESR 52 mm/h.', bcx:'Blood cultures: no growth at 24 h (final at 48 h pending).',
  ct_orb_c: s=> F('CT orbits/sinuses with contrast: complete opacification of the left ethmoid air cells and partial left maxillary sinus. A 9 × 4 mm lentiform, rim-enhancing collection along the left medial orbital wall (subperiosteal abscess) displacing the medial rectus laterally. Inflammatory stranding of the intraconal fat. Proptosis. No cavernous sinus thrombosis. Optic nerve not compressed.', SVG.ct({abscess:'OS',sinus:true,proptosis:'OS'}), 'Medial subperiosteal abscess with ethmoid sinusitis'),
  ct_orb:'Non-contrast CT: left ethmoid and maxillary opacification; medial orbital soft-tissue fullness suggestive of a subperiosteal collection but not well characterized without contrast. Consider contrast.',
  mri:'MRI orbits: medial subperiosteal collection with restricted diffusion, consistent with abscess. Ethmoid sinusitis. No cavernous sinus thrombosis. (Required sedation; CT with contrast would have answered the question faster.)',
  ivabx:'Ampicillin-sulbactam 50 mg/kg IV started (vancomycin added per institutional MRSA rate). Nasal decongestant per ENT.',
  poabx:'Amoxicillin-clavulanate given PO. (Insufficient for orbital involvement.)',
  ivsteroid:'IV dexamethasone given after antibiotics (some services add adjunctive steroids once antibiotics are on board).',
  posteroid:'Oral prednisone given.',
  ent:'ENT: "Ethmoid sinusitis with a medial SPA under 10 mm in a 9-year-old — we\'ll start with IV antibiotics and reassess in 24–48 h. If vision drops, an APD develops, or he fails to improve, we\'ll do endoscopic drainage. Please get vision checks every 4 hours."',
  peds:'Pediatrics will admit to the floor. Asks for your exam frequency and antibiotic recommendation.',
  attending: s=> anyGiven(s,['ct_orb_c','ct_orb','mri'])? 'Attending: "Orbital cellulitis with a small medial SPA — admit, IV antibiotics, ENT, q4h vision/pupil/motility checks. Most kids this age clear a <10 mm medial abscess on antibiotics alone. Any APD or vision drop and we drain. See him with me at 7."' : 'Attending: "Pain with eye movement, proptosis and limited abduction is orbital, not preseptal. He needs a contrast CT of orbits and sinuses, IV antibiotics and admission. Call me with the scan."',
  q_vision:'Nursing: VA, pupils, motility and color checks every 4 hours, call ophtho for any change.',
  plastics:'Oculoplastics: "Medial SPA in a child — ENT typically drains endoscopically if needed. We\'re available if it becomes lateral or intraconal."',
 },
 events:[
  {at:360, unless:['ivabx'], text:'Six hours in, no IV antibiotics. Fever to 39.6, proptosis more pronounced, the child now cannot abduct the left eye at all and a 1+ APD has appeared.', penalty:20},

 ],
 critical:[
  {label:'Visual acuity and pupils',any:['pupils'],within:30,pts:8},
  {label:'Motility and external exam — the preseptal vs orbital decision',any:['eom','ext','hertel'],within:30,pts:12},
  {label:'CT orbits and sinuses WITH contrast',any:['ct_orb_c','mri'],within:120,pts:14},
  {label:'IV antibiotics',any:['ivabx'],within:120,pts:20},
  {label:'Blood work incl. cultures',any:['cbc','bcx'],pts:4},
  {label:'ENT involvement for sinus source / abscess',any:['ent'],pts:8},
  {label:'Admit with serial vision checks',any:['q_vision','peds'],pts:6},
  {label:'Call attending',any:['attending'],pts:6},
 ],
 harmful:[
  {label:'Discharged on oral antibiotics',dispoAny:['dc_1wk','dc_1d'],pts:30,why:'Orbital cellulitis needs IV antibiotics in hospital. Oral therapy is for preseptal disease only.'},
  {label:'Steroids before antibiotics',check:(s)=> (given(s,'ivsteroid')||given(s,'posteroid')) && !given(s,'ivabx'),pts:8,why:'Adjunctive steroids are only considered after antibiotics are on board.'},
 ],
 helpful:['hx','hx_meds','va','color','sle','iop','ufe','dfe','crp','esr','bmp','glucose','ct_orb','plastics','analgesia','ivsteroid','antiemetic','pinhole','cvf'],
 dx:['orbital_cell'], dispo:['admit'], bestDispo:'admit',
 teaching:[
  'Preseptal vs orbital is decided by four findings: pain with eye movement, limited motility, proptosis, and any optic nerve sign (APD, reduced VA or color). Any one of them means orbital until proven otherwise. Fever and lid swelling alone don\'t separate them.',
  'The source in children is almost always the ethmoid sinus; the abscess forms under the periosteum of the medial wall (lamina papyracea).',
  'Imaging: CT orbits and sinuses with contrast. Non-contrast scans miss or under-call abscesses.',
  'Treat: IV antibiotics covering Strep, Staph (incl. MRSA where prevalent), H. influenzae and anaerobes; admit; q4h vision, pupil and motility checks.',
  'Surgery (ENT endoscopic drainage) for: optic nerve compromise, abscess >10 mm, age ≥9 with a large abscess or intracranial extension, or failure to improve at 24–48 h on IV antibiotics. Younger children with small medial abscesses often resolve without drainage (Garcia & Harris criteria).',
 ],
 onCall:'The peds ED wants a yes/no on discharge. The answer hinges on motility and proptosis, which you can assess in two minutes at the bedside even in a crying child. Then: contrast CT, IV antibiotics ordered before the scan, ENT paged, admit.',
 sources:[['EyeWiki: Orbital cellulitis','https://eyewiki.aao.org/Orbital_Cellulitis'],['Garcia GH, Harris GJ. Criteria for nonsurgical management of subperiosteal abscess of the orbit. Ophthalmology 2000','https://pubmed.ncbi.nlm.nih.gov/10964824/'],['AAO BCSC Section 7 — Oculofacial Plastic and Orbital Surgery: Orbital infections','https://www.aao.org/education/bcsc']],
},

 id:'rd', tier:1, title:'Flashes, floaters, a shadow', startLoc:'ED', startClock:19*60+30, startDay:4,
 patient:{label:'ED Fast Track 4', age:58, sex:'M'},
 page:'ED fast track: "58M with new floaters and flashes for 3 days, and since this morning a shadow in the lower part of his right vision. Vision seems okay. Is this something you need to see tonight or can he go to clinic Monday?" (It is Friday.)',
 vitals:{BP:'134/80',HR:'72',T:'36.7',SpO2:'99%',Pain:'0/10'},
 results:{
  hx:'Three days of a "cobweb" floater and arcs of light in the temporal periphery of the right eye, worse in the dark. Since this morning, a grey shadow rising from the inferonasal corner of his vision that has not changed through the day. Central vision still reads fine. High myope (−7.00 OU). No trauma. No prior eye surgery. Last meal at 17:30.',
  hx_meds:'Rosuvastatin. NKDA. Wears −7.00 D contact lenses.',
  va: s=> F(s.flags.macOff? 'VA cc: OD 20/400, OS 20/20. (Central vision has fallen since arrival.)' : 'VA cc: OD 20/30, OS 20/20.'),
  pupils:'OD 4 mm brisk, trace APD. OS 4 mm brisk.',
  cvf:'OD: dense inferonasal field defect extending toward fixation but sparing it. OS full.',
  iop:'IOP 11 OD, 15 OS (lower on the affected side, typical of RD).',
  sle: s=> F('OD: quiet anterior segment. Pigmented cells in the anterior vitreous ("tobacco dust", Shafer sign positive). OS: quiet.', SVG.slit({pupil:4,eye:'OD'}), 'Pigment in the anterior vitreous'),
  ufe: s=> F('OD: flat posterior pole, fovea appears attached. Weiss ring visible. A grey, corrugated elevation encroaching from the superotemporal periphery toward the arcade. Periphery not visible undilated.', SVG.fundus({rd:{quadrant:'sup-temp'}}), 'Superotemporal elevation approaching the arcade'),
  dfe: s=> F(s.flags.macOff? 'OD: superotemporal bullous RD now extending through the fovea — macula OFF. Horseshoe tear at 10:30 with a flap. Tobacco dust. OS: lattice at 11 and 1 o\'clock, no breaks.' : 'OD: superotemporal bullous rhegmatogenous retinal detachment from 9 to 12:30 extending posteriorly to within 1.5 disc diameters of the fovea. Fovea attached — macula ON. Horseshoe tear at 10:30 with an operculated flap, bridging vessel. PVD with Weiss ring. OS: lattice degeneration at 11 and 1 o\'clock, no breaks.', SVG.fundus({rd:{quadrant:'sup-temp',macOff:s.flags.macOff}}), s.flags.macOff? 'Macula-off RD with a horseshoe tear' : 'Macula-on superotemporal RD, horseshoe tear at 10:30'),
  depress: s=> F('OD: with scleral depression, a single horseshoe tear at 10:30 at the posterior border of lattice. No additional breaks 360°. Subretinal fluid extends to the ora from 9 to 12:30. OS: lattice at 11 and 1, no breaks on depression.', SVG.fundus({rd:{quadrant:'sup-temp',macOff:s.flags.macOff}}), 'Single break confirmed on depression'),
  bscan: s=> F('OD: membrane inserting at the disc with after-movement — retinal detachment, superotemporal. Fovea appears attached on this cut. PVD.', SVG.bscan({rd:true}), 'Detached retina on B-scan'),
  oct_mac: s=> F(s.flags.macOff? 'OD: subretinal fluid under the fovea with photoreceptor undulation — macula off.' : 'OD: foveal contour normal, no subretinal fluid under fixation. Shallow subretinal fluid at the superior edge of the scan. Macula ON, with fluid about 1 mm from the fovea.', SVG.oct({srf:s.flags.macOff}), s.flags.macOff? 'Subfoveal fluid — macula off' : 'Fovea attached; fluid at the superior edge'),
  photo:'Widefield photo documents superotemporal RD and horseshoe tear at 10:30.',
  retina: s=> anyGiven(s,['dfe','depress','bscan'])? (s.flags.macOff? 'Retina fellow: "Mac-off now. We\'ll repair in the next day or two — timing is less critical once the fovea is off, but let\'s not wait beyond that."' : 'Retina fellow: "Macula-on superotemporal RD with a single break — that\'s a tonight-or-first-thing case. Keep him NPO, lying flat with head turned to the right so the tear is dependent. I\'ll book the OR for first case tomorrow and talk to the attending. Pneumatic is an option if he can position."') : 'Retina fellow: "What does the periphery show? Do a depressed exam or at least a B-scan and call me back."',
  attending: s=> anyGiven(s,['retina'])? 'Attending: "Agree with retina. Mac-on RD gets fixed within 24 hours. Good catch on a Friday night."' : 'Attending: "Call the retina fellow directly — mac-on detachments are their urgency, not Monday\'s clinic."',
  npo:'NPO from now for possible surgery.',
  position:'Bed rest, supine with head turned toward the right shoulder so the superotemporal tear is dependent. Bathroom privileges only.',
  or_book:'OR posted for first case tomorrow: pars plana vitrectomy vs scleral buckle, right eye, with retina.',
  dilate:'Dilating drops instilled OD.',
 },
 events:[
  {at:1800, unless:['or_book'], text:'Thirty hours later: the patient calls — "my central vision went this afternoon." Fluid has tracked under the fovea. The detachment is now macula-off.', penalty:25, flag:'macOff'},
 ],
 critical:[
  {label:'Visual acuity',any:['va'],within:20,pts:4},
  {label:'Confrontation fields / pupils',any:['cvf','pupils'],within:20,pts:4},
  {label:'Dilated fundus exam',any:['dfe','depress'],within:60,pts:14},
  {label:'Determine macular status (exam, OCT or B-scan)',any:['dfe','depress','oct_mac','bscan'],pts:8},
  {label:'Find the break (scleral depression)',any:['depress'],pts:8},
  {label:'Retina consult tonight',any:['retina'],within:180,pts:16},
  {label:'NPO and positioning',any:['npo'],also:['position'],pts:8},
  {label:'OR within 24 hours',any:['or_book'],within:1440,pts:12},

 ],
 harmful:[
  {label:'Sent home to clinic in a week',dispoAny:['dc_1wk'],pts:25,why:'A macula-on RD threatening the fovea becomes macula-off within days. It is a 24-hour surgical problem.'},
  {label:'IOP-lowering or steroid drops',any:['timolol','pred_drops','diamox_po'],pts:3,why:'Not indicated.'},
 ],
 helpful:['hx','hx_meds','sle','iop','ufe','bscan','oct_mac','photo','dilate','analgesia','antiemetic','glucose','bmp','ekg','cbc','pinhole','eom','color'],
 dx:['rd_on'], dispo:['or_24','or_now','admit'], bestDispo:'or_24',
 teaching:[
  'Flashes + new floaters + a field defect = retinal detachment until proven otherwise. "Tobacco dust" (pigment in the anterior vitreous) is a near-pathognomonic bedside sign of a retinal break.',
  'The field defect is opposite the detachment: an inferonasal shadow means a superotemporal detachment. Superior detachments are the urgent ones — gravity carries fluid toward the fovea.',
  'Macular status drives timing. Mac-on: repair within 24 hours (some services say same day). Mac-off: within about a week, since the fovea is already off; final acuity correlates with duration off.',
  'Your job on call: dilate, scleral depress, document the break(s) and the macula, confirm with OCT or B-scan if needed, make NPO, position the patient so the tear is dependent, and call retina — not Monday\'s clinic.',
  'Check the fellow eye for lattice and breaks; high myopes have bilateral risk.',
 ],
 onCall:'Fast track wants to send him to Monday clinic. Dilate him yourself in the ED, depress the periphery, and call the retina fellow with "mac-on superotemporal RD, single HST at 10:30, patient NPO and positioned." That sentence gets him an OR slot.',
 sources:[['EyeWiki: Rhegmatogenous retinal detachment','https://eyewiki.aao.org/Rhegmatogenous_Retinal_Detachment'],['AAO Preferred Practice Pattern: Posterior vitreous detachment, retinal breaks, and lattice degeneration','https://www.aao.org/education/preferred-practice-pattern/posterior-vitreous-detachment-retinal-breaks-latti'],['AAO BCSC Section 12 — Retina and Vitreous','https://www.aao.org/education/bcsc']],
},

 helpful:['hx','hx_meds','pupils','iop','ext','fluor','ufe','dfe','cbc','crp','glucose','fortified','pred_drops','analgesia','antiemetic','npo','abx_drop','bmp','ekg','pinhole','eom','q_vision'],
 dx:['endoph'], dispo:['dc_1d','admit','obs','or_now'], bestDispo:'dc_1d',
 teaching:[
  'Pain, decreasing vision, hypopyon and vitritis within days of intraocular surgery is acute post-operative endophthalmitis. The main mimic, TASS, appears within 12–48 h, is sterile, usually painless, and typically shows diffuse limbus-to-limbus corneal edema without vitritis.',
  'Management is time-critical and intravitreal: tap (vitreous ± AC) for Gram stain and culture, then vancomycin 1 mg/0.1 mL + ceftazidime 2.25 mg/0.1 mL into the vitreous. This is done at the bedside or in a procedure room — not deferred to the morning.',
  'EVS (1995): with vision of hand motion or better, tap-and-inject equals immediate vitrectomy; with light perception only, vitrectomy triples the chance of 20/40 vision. Systemic antibiotics added nothing in post-cataract cases.',
  'Most common organisms: coagulase-negative Staphylococcus (about 70%), then S. aureus, Streptococcus species. Gram-negatives are rare but devastating.',
  'B-scan before tapping: confirms vitritis and rules out a retinal or choroidal detachment that changes the plan.',
 ],
 onCall:'A hypopyon after cataract surgery is one of the few things you do a procedure for in the middle of the night. Ask where the tap-and-inject kit lives before you need it, and know your institution\'s vancomycin and ceftazidime dilutions.',
 sources:[['Endophthalmitis Vitrectomy Study Group. Arch Ophthalmol 1995','https://pubmed.ncbi.nlm.nih.gov/8540549/'],['EyeWiki: Post-operative endophthalmitis','https://eyewiki.aao.org/Postoperative_Endophthalmitis'],['AAO BCSC Section 12 — Retina and Vitreous: Endophthalmitis','https://www.aao.org/education/bcsc']],
},

 patient:{label:'ED Triage 1', age:45, sex:'M'},

  hx_meds:'No medications. NKDA.',
  ph: s=>{ const irr = given(s,'irrigate'); const m = since(s,'irrigate'); if(!irr) return 'pH paper in the inferior fornix: OD 11, OS 10. (Alkaline. Irrigate before anything else.)'; if(m<10) return 'pH immediately after irrigation: OD 8, OS 7.5. Recheck in 5–10 minutes — pH can drift back up as alkali leaches from the tissue.'; return given(s,'sweep')? 'pH OD 7.4, OS 7.4 on recheck. Neutral and holding.' : 'pH OD 8.5, OS 7.4. The right eye is drifting alkaline again — retained particulate in the fornix? Evert and sweep.'; },

  sle: s=>{ const pre = !given(s,'irrigate'); const base = 'OD: diffuse epithelial loss involving about 60% of the cornea, moderate stromal haze obscuring iris detail, limbal ischemia (blanched, avascular limbus) over about 3 clock hours superiorly; chemosis. OS: 30% epithelial defect, clear stroma, no limbal ischemia, 2+ injection.'; return F(pre? 'You examined before irrigating; every minute the alkali stays on the eye it penetrates further. ' + base : base, SVG.slit({injection:2,haze:.35,chemosis:true,limbalIsch:true,pupil:4,eye:'OD'}), 'Corneal haze with 3 clock hours of limbal blanching OD'); },
  fluor: s=> F('OD: 60% epithelial defect staining brightly, including the superior limbus. OS: 30% defect, limbus intact.', SVG.slit({cobalt:true,defect:true,pupil:4,eye:'OD'}), 'Large epithelial defect under cobalt blue'),
  iop:'IOP 26 OD, 16 OS (alkali can cause early IOP rise from trabecular damage and shrinkage of the collagen).',

  pred_drops:'Prednisolone acetate 1% q2h while awake both eyes, to be tapered after day 7–10 (steroids after day 10 impair stromal repair).',
  vitc:'Vitamin C 1 g PO QID and doxycycline 100 mg BID started.',

  attending: s=> given(s,'irrigate')? 'Attending: "Right eye is a grade III alkali burn with limbal ischemia — that one could scar and may need amniotic membrane in the next day or two. Hourly tears, steroid, cycloplegic, antibiotic, vitamin C, doxy. Check IOP. I\'ll see him in clinic at 8 am."' : 'Attending: "Have you irrigated and checked pH? Nothing else matters until the pH is neutral. Call me after."',

 },

 ],

  {label:'Pressure patch over possible retained particulate',any:['patch'],pts:5,why:'Sweep the fornices first; patching is optional later.'},
 ],
 helpful:['hx','hx_meds','pupils','ufe','tears','timolol','diamox_po','analgesia','poison','tetanus','antiemetic','bmp','pinhole','eom','cvf','color'],
 dx:['chem'], dispo:['dc_1d','obs'], bestDispo:'dc_1d',
 teaching:[
  'Chemical injury is treated before it is examined: anesthetic, pH, irrigate with liters of LR or saline until pH is 7–7.5, wait 5–10 minutes, recheck, repeat. Then evert the lids and sweep the fornices — cement, lime and plaster leave particles that keep releasing alkali.',
  'Alkali (lye, ammonia, cement, lime) saponifies cell membranes and penetrates rapidly; acids coagulate protein and self-limit. Alkali injuries are worse.',
  'Grade the burn (Roper-Hall / Dua) by limbal ischemia and corneal clarity. Limbal ischemia over ≥3 clock hours means stem-cell loss and a guarded prognosis; these may need amniotic membrane early.',
  'Treatment: topical antibiotic, cycloplegic for comfort, topical steroid for the first 7–10 days then taper, hourly preservative-free lubrication, oral vitamin C (collagen synthesis) and doxycycline (anti-collagenase). Check IOP — it rises early.',
  'Daily follow-up until the epithelium heals. Late complications: symblepharon, limbal stem cell deficiency, glaucoma, corneal melt.',
 ],
 onCall:'Tell triage to start irrigating with a Morgan lens before you arrive — you can give that order from the phone. Bring pH paper; the ED often has none.',
 sources:[['EyeWiki: Chemical (alkali and acid) injury of the conjunctiva and cornea','https://eyewiki.aao.org/Chemical_(Alkali_and_Acid)_Injury_of_the_Conjunctiva_and_Cornea'],['Dua HS et al. A new classification of ocular surface burns. Br J Ophthalmol 2001','https://pubmed.ncbi.nlm.nih.gov/11673310/'],['Wills Eye Manual — Chemical burn','https://www.wolterskluwer.com/en/solutions/ovid/the-wills-eye-manual-14286']],
},

 helpful:['hx','hx_meds','va','cvf','color','sle','iop','pilocarpine','ct_orb','stroke','neuroophth','glucose','a1c','esr','crp','cbc','ekg','bmp','analgesia','antiemetic','q_vision','pinhole'],
 dx:['cn3'], dispo:['admit','transfer'], bestDispo:'admit',
 teaching:[
  'The rule of the pupil: the pupillomotor fibers run on the outer surface of the third nerve, so compression (aneurysm, uncal herniation) involves the pupil early, while microvascular ischemia (diabetes, hypertension) typically spares it. A dilated, poorly reactive pupil with a third nerve palsy is an aneurysm until proven otherwise.',
  'Complete external palsy with a normal pupil in a vasculopath over 50 can be observed with close follow-up — but any pupil involvement, partial palsy, age under 50, other cranial nerve signs, or a severe headache gets imaged emergently.',
  'Imaging: CTA has high sensitivity for aneurysms ≥3 mm and is fast. MRI/MRA is the alternative; catheter angiography if non-invasive imaging is negative and suspicion remains high.',
  'Localize first: isolated third (ptosis, eye down and out, pupil) vs. third plus other nerves (cavernous sinus, orbital apex) vs. nuclear/fascicular (brainstem signs).',
  'A non-contrast CT head excludes hemorrhage, not an aneurysm. "CT head negative" is not reassurance here.',
 ],
 onCall:'The ED has already written "diabetic third nerve palsy" in the chart. Your exam of one pupil changes the entire disposition. Document the pupil size and reactivity in both eyes in millimetres, call for the CTA yourself, and don\'t leave until it\'s ordered.',
 sources:[['EyeWiki: Third nerve palsy','https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy'],['AAO BCSC Section 5 — Neuro-Ophthalmology: Ocular motor cranial nerve palsies','https://www.aao.org/education/bcsc'],['Wills Eye Manual — Isolated third nerve palsy','https://www.wolterskluwer.com/en/solutions/ovid/the-wills-eye-manual-14286']],
},

 dx:['hyphema'], dispo:['dc_1d','admit'], bestDispo:'dc_1d',
 teaching:[
  'Grade the hyphema (I <⅓, II ⅓–½, III >½, IV total/eight-ball) and check IOP; higher grades mean higher IOP and rebleed risk. Always exclude an open globe and check the posterior segment (B-scan if no view).',
  'Sickle screen every Black patient with a hyphema. Sickle trait matters as much as disease: sickled cells clog the meshwork, IOP rises at lower hyphema volumes, and the optic nerve tolerates less. Avoid CAIs and hyperosmotics; be cautious with brimonidine/apraclonidine. Operate if IOP >24 for >24 h.',
  'Standard care: rigid shield, head elevation ≥30–45°, limited activity, cycloplegia (atropine), topical steroid, no aspirin/NSAIDs. Antifibrinolytics (tranexamic/aminocaproic acid) are optional for higher-risk patients.',
  'Rebleeding (5–10%) occurs at days 2–5 as the clot lyses and is worse than the first bleed — so daily visits for 5 days, checking IOP, hyphema size and cornea for blood staining.',
  'Defer gonioscopy and scleral depression to after the first week; look for angle recession and warn about lifelong glaucoma risk. Protective eyewear for return to sport.',
 ],
 onCall:'Most hyphemas go home — but the two phone calls that change management are the sickle prep result and whether the family can bring him back every day for five days. Make both before you discharge.',
 sources:[['EyeWiki: Hyphema','https://eyewiki.aao.org/Hyphema'],['Gharaibeh A et al. Medical interventions for traumatic hyphema. Cochrane 2019','https://pubmed.ncbi.nlm.nih.gov/30640411/'],['Wills Eye Manual — Hyphema and microhyphema','https://www.wolterskluwer.com/en/solutions/ovid/the-wills-eye-manual-14286']],
},

 helpful:['hx','hx_meds','va','pinhole','cvf','eom','sle','iop','oct_rnfl','oct_mac','esr','crp','cbc','rpr','ace','cxr','quant','counsel_dm','counsel_return','analgesia','ct_orb','glucose','bmp'],
 dx:['on'], dispo:['admit','dc_1d','dc_1wk'], bestDispo:'dc_1wk',
 teaching:[
  'Typical optic neuritis: 20–45, often female, subacute monocular vision loss, pain with eye movement (90%), APD, dyschromatopsia, and — two-thirds of the time — a normal-looking disc. Vision nadirs at ~2 weeks and recovers over weeks to months.',
  'The MRI is for the brain, not the nerve: white-matter lesions set the 15-year MS risk (ONTT: 25% with none vs 72% with ≥1). Gadolinium-enhanced MRI brain and orbits is the test; CT contributes nothing.',
  'ONTT: IV methylprednisolone 1 g × 3 days speeds recovery (not final acuity) and may delay a second demyelinating event in those with MRI lesions. Standard-dose oral prednisone alone increased recurrence — don\'t.',
  'Atypical features (bilateral, no pain, severe disc swelling with hemorrhages, no recovery by 4–6 weeks, age >50, progressive) → think NMOSD, MOG, sarcoid, syphilis, compressive lesion; send aquaporin-4 and MOG antibodies.',
  'Logistics on call: an outpatient clinic can\'t get a same-day contrast MRI; this is the case where you move the patient (ED or infusion unit) to get the right test.',
 ],
 onCall:'Not an eye emergency, but a diagnosis that changes a 29-year-old\'s life. Get the MRI arranged before she leaves the building and make the neurology referral yourself rather than leaving it to the clinic.',
 sources:[['EyeWiki: Demyelinating optic neuritis','https://eyewiki.aao.org/Demyelinating_Optic_Neuritis'],['Optic Neuritis Study Group. Visual function 15 years after optic neuritis. Ophthalmology 2008','https://pubmed.ncbi.nlm.nih.gov/18272213/'],['AAO BCSC Section 5 — Neuro-Ophthalmology','https://www.aao.org/education/bcsc']],
},

 helpful:['hx','hx_meds','hertel','color','sle','iop','ufe','cbc','crp','analgesia','tears','ct_orb_c','plastics','cvf'],
 dx:['preseptal'], dispo:['dc_1d'], bestDispo:'dc_1d',
 teaching:[
  'Preseptal cellulitis is infection anterior to the orbital septum: lid swelling, redness and warmth with a white eye, full painless motility, no proptosis, normal vision and pupils.',
  'Four findings make it orbital: pain with eye movement, limited motility/diplopia, proptosis, and any optic nerve sign. If none are present in an adult who can be examined well, imaging is not required.',
  'Adults and children over about 1 year with mild preseptal disease: oral antibiotics (amoxicillin-clavulanate; add MRSA coverage where prevalent), warm compresses, recheck in 24–48 h. Infants, toxic patients and treatment failures get IV therapy.',
  'Common sources: skin break (bite, scratch, hordeolum), adjacent sinusitis, dacryocystitis. The source guides coverage.',
  'A "control" case matters: part of competence is recognizing when not to escalate, and documenting the negatives (motility, proptosis, pupils, vision) that make discharge safe.',
 ],
 onCall:'Most calls like this can be settled by phone with the right questions, but a PGY-2 should go and look the first dozen times. Document the four orbital negatives explicitly and give the ED a line to copy: "preseptal, no orbital signs, PO Augmentin, ophtho recheck 48 h."',
 sources:[['EyeWiki: Preseptal cellulitis','https://eyewiki.aao.org/Preseptal_Cellulitis'],['AAO BCSC Section 7 — Oculofacial Plastic and Orbital Surgery','https://www.aao.org/education/bcsc'],['Wills Eye Manual — Preseptal cellulitis','https://www.wolterskluwer.com/en/solutions/ovid/the-wills-eye-manual-14286']],
},

 dx:['hzo'], dispo:['dc_1d','dc_1wk'], bestDispo:'dc_1d',
 teaching:[
  'HZO = varicella-zoster reactivation in V1. Nasociliary involvement (Hutchinson sign: side/tip of the nose) roughly doubles the risk of ocular involvement, but its absence does not exclude it.',
  'Ocular findings by layer and time: lid vesicles and conjunctivitis (first week), pseudodendrites (raised, grey, tapered, stain poorly — unlike HSV dendrites with terminal bulbs), stromal keratitis and uveitis with trabeculitis-driven IOP rise (1–3 weeks), scleritis, cranial nerve palsies, and rarely acute retinal necrosis. Reduced corneal sensation is the clue to later neurotrophic disease.',
  'Treat with oral antiviral (valacyclovir 1 g TID, famciclovir 500 mg TID, or acyclovir 800 mg 5×/day) for 7–10 days, ideally within 72 h of rash onset; when the eye is involved most treat regardless of timing. IV acyclovir for immunocompromised patients or retinitis.',
  'Uveitis: topical steroid plus cycloplegic under antiviral cover, with a slow taper over weeks to months — abrupt stops cause rebound. Trabeculitis IOP responds to steroid plus aqueous suppressants.',
  'Postherpetic neuralgia is common over 60; early gabapentin/TCA helps. Recommend recombinant zoster vaccine after recovery; the ZEDS trial supports a year of low-dose valacyclovir to reduce recurrent eye disease.',
 ],
 onCall:'The ED has the antiviral right; your job is the eye: pseudodendrites vs true dendrites, cell in the AC, the pressure, and a dilated look at the retina. Put him in clinic within 3–4 days — the stromal disease and pressure spikes come after the rash.',
 sources:[['EyeWiki: Herpes zoster ophthalmicus','https://eyewiki.aao.org/Herpes_Zoster_Ophthalmicus'],['Zoster Eye Disease Study (ZEDS) — NEI','https://www.nei.nih.gov/research/clinical-trials/zoster-eye-disease-study'],['AAO BCSC Section 8 — External Disease and Cornea','https://www.aao.org/education/bcsc']],
},

  'This is the mirror of the aneurysm case. A complete motor third nerve palsy with a normal pupil in a vasculopath over 50, with no other neurologic signs and no severe headache, is usually microvascular and recovers within about three months.',

 teaching:[
  'A hordeolum is an acute infected gland at the lid margin: a focal, tender, red nodule. A chalazion is the chronic, non-tender version. Both are often mislabelled as cellulitis.',
  'The distinction from preseptal cellulitis: the swelling is focal and centred on a lid-margin lesion, rather than diffuse erythema spreading beyond the lid.',

 ],

 'ulcer:fluor':{f:'ulcer_slit.jpg',credit:'Jesse Vislisel, MD; photo Carol Chan, CRA',lic:'ER-ATLAS',cap:'Slit view of the infiltrate'},
 'rbh:ext':{f:'rbh_proptosis.jpg',credit:'Andrew Doan, MD, PhD',lic:'ER-ATLAS',cap:'Proptosis from retrobulbar hemorrhage'},
 'rbh:ct_orb':{f:'rbh_ct.jpg',credit:'EyeRounds case 168',lic:'ER-CASE',cap:'CT: orbital hematoma with proptosis'},
 'hyphema:sle':{f:'hyphema.jpg',credit:'Jesse Vislisel, MD; photo Antoinette Venckus, CRA',lic:'ER-ATLAS',cap:'Layered traumatic hyphema',when:s=>!s.flags.rebleed},
 'preseptal:ext':{f:'preseptal.jpg',credit:'Robert B. Dinn, MD; Jordan Graff, MD',lic:'ER-ATLAS',cap:'Preseptal cellulitis'},
 'hzo:ext':{f:'hzo_rash.jpg',credit:'Jordan Graff, MD',lic:'ER-ATLAS',cap:'V1 zoster respecting the midline'},
 'hzo:sle':{f:'hzo_pseudodendrites.jpg',credit:'Jeff Welder, MD; Jesse Vislisel, MD; photo Cindy Montague, CRA',lic:'ER-ATLAS',cap:'VZV pseudodendrites'},
 'uveitis:sle':{f:'uveitis_synechiae.jpg',credit:'EyeRounds case 334',lic:'ER-CASE',cap:'Posterior synechiae with pigment on the lens capsule'},

};
function mediaFor(caseId,orderId,s){ const m=MEDIA[caseId+':'+orderId]; if(!m) return ''; if(m.when && !m.when(s)) return ''; return `<div class="photo"><img src="images/${m.f}" alt="${esc(m.cap)}" loading="lazy" onerror="this.parentNode.style.display='none'"><div class="cap">${esc(m.cap)} — ${esc(m.credit)}. ${esc(LIC[m.lic])}.</div></div>`; }
</script>
