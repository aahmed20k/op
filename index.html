<script>
/* ---------- persistence ---------- */
const KEY='firstcall.v3', DAY=86400000;
function load(){ let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)); }catch(e){} if(!d){ try{ d=JSON.parse(localStorage.getItem('firstcall.v2')); }catch(e){} } d=d||{}; ['best','skh','rev','logi','reviews','nights'].forEach(k=>{ d[k]=d[k]||{}; }); return d; }
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
let DATA=load();

/* ---------- state ---------- */
let S=null, NIGHT=null, VIEW='start', TAB='os', selCase=null, realStart=null, realTimer=null, endTimer=null;
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function ccsTime(t,P){ P=P||S; const abs=P.base+t; const d=Math.floor(abs/1440); const m=((abs%1440)+1440)%1440; return `Day ${d+1} @ ${Math.floor(m/60)}:${pad(m%60)}`; }
function ccsTimeDay(t,P){ P=P||S; const d=Math.floor((P.base+t)/1440); return `${ccsTime(t,P)} (${(DAYS[(P.startDay||0)+d]||'').slice(0,3)})`; }
function simTime(t){ return ccsTimeDay(t); }
function shortTime(t){ return ccsTime(t); }
function elStr(t){ if(t<60) return `${t} min`; const h=Math.floor(t/60), m=t%60; if(h<48) return `${h} h${m?' '+m+' min':''}`; return `${Math.floor(h/24)} d ${h%24} h`; }
function elapsedStr(t){ const d=Math.floor(t/1440), h=Math.floor((t%1440)/60), m=t%60; return `${d} Days ${pad(h)} Hrs ${pad(m)} Mins`; }
const TABOF=o=> o.c==='Labs'?'lab': o.c==='Imaging'? (['ekg','hvf','bp'].includes(o.id)?'other':'img') : (['History','Exam','Exam aid'].includes(o.c))?'pn':'tx';
const caseNo=c=>String(CASES.indexOf(c)+1).padStart(2,'0');
const NEUTRAL=new Set(['hx','hx_meds','va','pupils','proparacaine','retractor','child_assist','attending','analgesia','counsel_return','counsel_meds','tears','pinhole','bp']);
const DISTINCT=id=>!['hx','hx_meds','va','pupils','sle','iop','ufe','dfe','attending','counsel_return','pinhole'].includes(id);

/* ---------- patients ---------- */
function newPatient(c,base,startDay){ return {c,base,startDay:startDay!=null?startDay:(c.startDay||0),t:0,loc:c.startLoc,orders:[],given:{},pending:[],feed:[],flags:{},fired:new Set(),penalties:[],positives:0,improved:false,dx:null,dispo:null,ended:false,caseEnd:false,endSoon:false,appt:null,unread:{},arrived:false,arrivedAt:null,asked:[],qa:[],triage:null,calls:[],quiz:{},note:null,inbox:[]}; }
function startCase(id){
  NIGHT=null; const c=CASES.find(x=>x.id===id);
  S=newPatient(c,c.startClock); realStart=Date.now();
  VIEW='page'; render();
}
function arrive(P,show){
  if(P.arrived) return; P.arrived=true; P.arrivedAt=P.t; P.given.hx=P.t;
  P.feed.push({t:P.t,tab:'pn',title:'Initial history',text:P.c.results.hx});
  if(show!==false && P===S) intro();
}
function intro(){
  const c=S.c;
  dialog({title:'At the bedside',body:`<p><b>Location:</b> ${esc(LOCN[S.loc])}<br><b>Simulated time:</b> ${esc(simTime(S.t))}</p><p><b>${esc(c.patient.label)}</b> — ${c.patient.age}-year-old ${c.patient.sex==='F'?'woman':'man'}.</p>`,
   buttons:[['OK',()=>{ dialog({title:'Vital Signs',body:vitalsHtml(),buttons:[['OK',()=>{
     dialog({title:'Initial History',body:`<div class="sunk" style="max-height:50vh;overflow:auto;white-space:pre-wrap;padding:6px">${esc(c.results.hx)}</div><p class="small" style="margin-top:8px">The physical examination has not been performed. Use <b>Interval Hx or PE</b> to examine the patient.</p>`,buttons:[['OK',null]]}); }]]}); }]]});
}
function vitalsHtml(){ const v=S.c.vitals; return `<div class="vit">${Object.entries(v).map(([k,val])=>`<div><span>${esc(k)}</span><b>${esc(val)}</b></div>`).join('')}</div>`; }
function minsTo(P,clock){ const abs=P.base+P.t; let tgt=Math.floor(abs/1440)*1440+clock; if(tgt<=abs) tgt+=1440; return tgt-abs; }

/* ---------- orders ---------- */
function phoneAllowed(P,o){ if(['Medication','Labs','Consult'].includes(o.c)) return true; if(o.c==='Imaging' && o.loc.includes(P.loc)) return true; if(PHONE_IDS.includes(o.id)) return true; if(P.c.startLoc==='CL' && TECH_IDS.includes(o.id)) return true; return false; }
function placeOrder(id,silent,extra){
  const P=S; if(!P||P.ended) return false;
  const o=ORD[id]; if(!o) return false;
  if(CALLS.includes(id) && !(extra&&extra.called)){ composeCall(id); return false; }
  if(!P.arrived && P.loc!=='HOME' && !phoneAllowed(P,o)){ if(!silent) dialog({title:'Not at the bedside',body:`<p>You are not with the patient yet. From the phone you can order medications, labs, imaging, consults, irrigation, a shield and NPO${P.c.startLoc==='CL'?', and ask the technician for vision, pressure, color, dilation and imaging':''}.</p>`,buttons:[['OK',null]]}); return false; }
  if(P.loc==='HOME' && o.c!=='Consult' && o.c!=='Counseling'){ if(!silent) dialog({title:'Patient at home',body:`<p>The patient is at home. <b>${esc(o.n)}</b> can be done at the scheduled visit, or bring the patient back sooner with <b>Change Location</b>.</p>`,buttons:[['OK',null]]}); return false; }
  if(P.loc!=='HOME' && !o.loc.includes(P.loc)){
    if(!silent) dialog({title:'Order not available',body:`<p><b>${esc(o.n)}</b> cannot be performed in the ${esc(LOCN[P.loc])}.</p><p>Available in: ${esc(o.loc.map(l=>LOCN[l]).join(' or '))}. Use <b>Change Location</b>.</p>`,buttons:[['OK',null]]});
    return false;
  }
  const rec={id,at:P.t,status:'pending',route:(extra&&extra.route)||'',freq:(extra&&extra.freq)||'',byPhone:!P.arrived};
  P.orders.push(rec); P.pending.push({id,at:P.t,resultAt:P.t+o.t,rec});
  if(P.caseEnd){ renderAll(); return true; }
  if(o.t<=5) advanceTo(P.t+o.t,{quiet:true}); else renderAll();
  return true;
}
function cancelOrder(rec){ S.pending=S.pending.filter(p=>p.rec!==rec); rec.status='cancelled'; renderAll(); }
function hasOrder(k,by,P){ P=P||S; return P.orders.some(o=>o.status!=='cancelled' && !o.failed && o.at<=by && (o.id===k || ORD[o.id].gives===k)); }
function resolve(P,p){
  const o=ORD[p.id], c=P.c; p.rec.status='done'; p.rec.resultAt=p.resultAt;
  const b=c.barrier, tab=TABOF(o);
  if(b && b.blocks.includes(p.id) && !p.rec.byPhone && !b.needs.some(n=>P.orders.some(x=>x!==p.rec && x.id===n && x.status!=='cancelled' && x.at<=p.rec.at))){
    p.rec.failed=true; P.feed.push({t:p.resultAt,tab:'pn',title:o.n+' — could not be done',text:b.text,update:true});
    if(!(P===S && TAB==='pn')) P.unread.pn=(P.unread.pn||0)+1; return;
  }
  if(P.given[p.id]==null) P.given[p.id]=p.resultAt;
  if(o.gives && P.given[o.gives]==null) P.given[o.gives]=p.resultAt;
  let r=c.results[p.id]; if(r==null) r=DEFAULTS[p.id]; if(r==null) r=(o.c==='Medication')? GENERIC_MED:'Done.';
  if(typeof r==='function') r=r(P); if(typeof r==='string') r={text:r};
  let text=r.text; if(p.id==='sle' && P.loc==='ED') text='(Portable slit lamp in the ED.) '+text;
  const entry={t:p.resultAt,tab,title:o.n,text,fig:r.fig||null,cap:r.cap||'',photo:mediaFor(c.id,p.id,P),byPhone:p.rec.byPhone};
  (c.see||[]).forEach((q,i)=>{ if(P.quiz[i]==null && q.on.includes(p.id) && entry.quiz==null){ P.quiz[i]={pending:true,opts:shuffle(q.opts)}; entry.quiz=i; } });
  P.feed.push(entry);
  if(!(P===S && TAB===tab)) P.unread[tab]=(P.unread[tab]||0)+1;
}
function fireEvent(P,ev,i){
  P.fired.add(i);
  if(ev.unless.some(k=>hasOrder(k,ev.at,P))) return false;
  if(ev.flag) P.flags[ev.flag]=true;
  P.penalties.push({label:ev.text,pts:ev.penalty,t:ev.at});
  P.feed.push({t:ev.at,tab:'pn',title:'Patient update',text:ev.text,update:true});
  if(!(P===S && TAB==='pn')) P.unread.pn=(P.unread.pn||0)+1;
  return true;
}
/* the clock for one patient; bg = background (night mode) */
function clockCore(P,target,opt){
  opt=opt||{}; const out={stop:null,positive:false,arrivedAppt:false};
  if(P.ended||P.caseEnd) return out;
  while(true){
    let nextT=Infinity, what=null;
    P.pending.forEach(p=>{ if(p.resultAt<nextT){ nextT=p.resultAt; what={type:'p',p}; } });
    P.c.events.forEach((ev,i)=>{ if(!P.fired.has(i) && ev.at>P.t && ev.at<=nextT){ nextT=ev.at; what={type:'e',ev,i}; } });
    const im=P.c.improve; if(im && !P.improved && im.at>P.t && im.at<=nextT){ nextT=im.at; what={type:'i',im}; }
    if(P.appt && P.appt.at>P.t && P.appt.at<=nextT){ nextT=P.appt.at; what={type:'a'}; }
    if(nextT>target||!what) break;
    P.t=nextT;
    if(what.type==='p'){ P.pending=P.pending.filter(x=>x!==what.p); resolve(P,what.p); if(opt.stopAtResult&&!opt.bg){ target=P.t; break; } }
    else if(what.type==='e'){ if(fireEvent(P,what.ev,what.i)){ if(opt.bg){ P.inbox.push(what.ev.text); continue; } out.stop=what.ev; target=P.t; break; } }
    else if(what.type==='i'){ P.improved=true; const im2=what.im; const ok=im2.any? im2.requires.some(k=>hasOrder(k,im2.at,P)) : im2.requires.every(k=>hasOrder(k,im2.at,P));
      if(ok){ P.positives++; P.feed.push({t:P.t,tab:'pn',title:'Patient update',text:im2.text,update:true}); if(!(P===S&&TAB==='pn')) P.unread.pn=(P.unread.pn||0)+1; if(opt.bg){ P.inbox.push(im2.text); continue; } out.stop=im2; out.positive=true; target=P.t; break; } }
    else if(what.type==='a'){ P.loc=P.appt.to; P.feed.push({t:P.t,tab:'pn',title:'Scheduled visit',text:`Patient arrives in the ${LOCN[P.loc]}.`}); P.appt=null; if(!P.arrived) arrive(P,false); if(opt.bg) continue; out.arrivedAppt=true; target=P.t; break; }
  }
  P.t=Math.max(P.t,target); return out;
}
function advanceTo(target,opt){
  opt=opt||{}; const P=S; if(!P||P.ended||P.caseEnd) return;
  const firstArrival=!P.arrived;
  const r=clockCore(P,target,opt);
  if(NIGHT) nightSync();
  renderAll();
  const after=()=>{ if(NIGHT) return; if(P.positives>=1 && P.improved && r.positive){ P.endSoon=true; dialog({title:'Case Progress',body:'<p>The patient is responding to treatment. The case will move to its end after your next clock advance.</p>',buttons:[['OK',null]]}); } else if(P.penalties.length>=2 && !P.caseEnd){ dialog({title:'Case Progress',body:'<p>The patient has had repeated negative updates. The case is moving to its end.</p>',buttons:[['OK',()=>caseEnd()]]}); } };
  if(r.stop){ if(P.loc==='HOME' && !r.positive){ P.loc='ED'; P.appt=null; if(!P.arrived) arrive(P,false); P.feed.push({t:P.t,tab:'pn',title:'Unscheduled visit',text:'The patient has come back to the emergency department.'}); renderAll(); }
    dialog({title:'Patient Update',body:`<p><b>${esc(simTime(P.t))}</b></p><p>${esc(r.stop.text)}</p>`,buttons:[['OK',()=>after()]]}); }
  else if(r.arrivedAppt){ if(firstArrival && P.arrived) intro(); else dialog({title:'Change Location',body:`<p>The patient has arrived in the <b>${esc(LOCN[P.loc])}</b>.</p><p>Simulated time: ${esc(simTime(P.t))}</p>`,buttons:[['OK',null]]}); }
  else if(opt.announce){ if(P.endSoon && !NIGHT){ caseEnd(); } else dialog({title:'Simulated time',body:`<p>The simulated time is now <b>${esc(simTime(P.t))}</b>.</p>${P.pending.length?`<p class="small">${P.pending.length} order(s) still pending.</p>`:''}`,buttons:[['OK',null]]}); }
  if(NIGHT) nightNotify();
}
function caseEnd(){
  if(S.caseEnd||S.ended) return;
  if(NIGHT){ if(S.endPrompted) return; S.endPrompted=true; dialog({title:'Ready for sign-out',body:'<p>This patient\'s course has declared itself. Sign them out when you are ready (Exit Case), or keep working.</p>',buttons:[['Sign out now',()=>dlgExit(false)],['Later',null]]}); return; }
  S.caseEnd=true; S.pending.forEach(p=>{ p.rec.status='cancelled'; }); S.pending=[]; renderAll();
  dialog({title:'Case-End Instructions',body:`<p>This case is coming to an end. You have <b>2 minutes</b> of real time to add or cancel orders. You may no longer examine the patient, change location, or advance simulated time, and pending orders will not report.</p><p>Add any final orders (a consult, counseling, follow-up), then click <b>Exit Case</b>.</p>`,buttons:[['OK',null]]});
  endTimer=setTimeout(()=>{ if(S&&!S.ended) dlgExit(true); },120000);
}
function sendHome(to,mins){ S.feed.push({t:S.t,tab:'pn',title:'Change of location',text:`Patient sent home from the ${LOCN[S.loc]}. Return: ${LOCN[to]} at ${ccsTime(S.t+mins)}.`}); S.loc='HOME'; S.appt={to,at:S.t+mins}; advanceTo(S.t+mins,{}); }
function move(to){ const mv=MOVES[S.loc][to]; if(!mv) return; S.feed.push({t:S.t,tab:'pn',title:'Change of location',text:`Patient moved from ${LOCN[S.loc]} to ${LOCN[to]}. Transport and check-in: ${mv.t} minutes.`}); S.loc=to; advanceTo(S.t+mv.t,{}); dialog({title:'Change Location',body:`<p>The patient has arrived in the <b>${esc(LOCN[to])}</b>.</p><p>Simulated time: ${esc(simTime(S.t))}</p>`,buttons:[['OK',null]]}); }

/* ---------- call night ---------- */
function startNight(id){
  const def=NIGHTS.find(n=>n.id===id);
  NIGHT={def,abs0:def.start,G:0,endG:(7*60+1440)-def.start,pts:[],paged:{},queue:[],prev:null,over:false};
  realStart=Date.now(); S=null;
  nightCatchUp(); const first=NIGHT.queue.shift(); openPage(first);
}
function nightSync(){ const N=NIGHT; if(S && !S.ended) N.G=Math.max(N.G,S.base+S.t-N.abs0); nightCatchUp(); }
function nightCatchUp(all){
  const N=NIGHT;
  N.pts.forEach(P=>{ if((P===S && !S.ended && !all)||P.ended) return; clockCore(P,N.abs0+N.G-P.base,{bg:true}); });
  N.def.pages.forEach((pg,i)=>{ if(!N.paged[i] && pg.at<=N.G){ N.paged[i]=true; const c=CASES.find(x=>x.id===pg.c); const P=newPatient(c,N.abs0+pg.at,N.def.startDay); P.pagedAt=pg.at; clockCore(P,N.G-pg.at,{bg:true}); P.inbox=[]; N.pts.push(P); N.queue.push(P); } });
  if(N.G>=N.endG) N.over=true;
}
function nightNotify(){
  const N=NIGHT; if(!N) return; if(document.querySelector('.modal-bg')){ clearTimeout(N._nt); N._nt=setTimeout(nightNotify,400); return; } const msgs=[];
  N.pts.forEach(P=>{ if(P!==S && P.inbox.length){ P.inbox.forEach(m=>msgs.push(`<p><b>${esc(P.c.patient.label)}</b> · ${esc(ccsTime(P.t,P))}<br>${esc(m)}</p>`)); P.inbox=[]; } });
  if(N.over && !N.overShown){ N.overShown=true; dialog({title:'Morning',body:'<p>It is 07:00 and the day team has arrived. Your call night is over.</p>',buttons:[['See how the night went',()=>endNight()]]}); return; }
  const showPage=()=>{ if(VIEW==='page' || !N.queue.length) return; const nx=N.queue[0]; dialog({title:'Pager',body:`<p>Your pager is going off: <b>${esc(nx.c.patient.label)}</b>, ${esc(ccsTime(nx.t,nx))}.</p>`,buttons:[['Answer the page',()=>{ N.queue.shift(); openPage(nx); }]]}); };
  if(msgs.length) dialog({title:'Updates on your other patients',body:`<div style="max-height:50vh;overflow:auto">${msgs.join('')}</div>`,buttons:[['OK',()=>showPage()]]}); else showPage();
}
function openPage(P){ if(NIGHT){ if(S && S!==P && !S.ended) NIGHT.prev=S; } S=P; VIEW='page'; render(); }
function goTo(P){ if((P===S&&P.arrived)||P.ended||P.phoned) return; S=P; P.queued=false; VIEW='play'; TAB='os'; render(); advanceTo(P.t+10,{}); if(!P.arrived){ arrive(P); renderAll(); } }
function nightWait(){ const N=NIGHT; const next=N.def.pages.map((p,i)=>N.paged[i]?Infinity:p.at).reduce((a,b)=>Math.min(a,b),Infinity); N.G=Math.min(next===Infinity?N.endG:next,N.endG); nightCatchUp(true); renderAll(); nightNotify(); }
function endNight(){
  const N=NIGHT; document.querySelectorAll('.modal-bg').forEach(e=>e.remove());
  N.pts.forEach(P=>{ if(!P.ended){ P.unsigned=!P.phoned; P.ended=true; finishPatient(P); } });
  const scores=N.pts.map(P=>P.result.total); N.score=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  N.missed=N.def.pages.length-N.pts.length;

/* ---------- phone call composer ---------- */
function composeCall(id){
  const P=S, c=P.c; let opener=null, dx=null, plan=null; const items=new Set();
  const plans=P._plans||(P._plans=shuffle([c.sbar.plan,...(c.sbar.wrong||[])].filter(Boolean)).concat(['Ask: "What would you like me to do?"']));
  const isDone=k=>k.split('|').some(x=>done(P,x));
  const bg=dialog({title:'Phone call — '+ORD[id].n.replace(/^Call /,''),body:'',buttons:[]});
  const body=bg.querySelector('.body');
  const draw=()=>{
    body.innerHTML=`<p class="small">Build what you will say. Your attending scores you on the opening, the working diagnosis, the findings you report, and what you propose.</p>
     <fieldset class="group"><legend>Open with</legend><div class="radio">${OPENERS.map((o,i)=>`<label><input type="radio" name="op" value="${i}" ${opener===i?'checked':''}> ${esc(o)}</label>`).join('')}</div></fieldset>
     <fieldset class="group"><legend>Working diagnosis</legend><select id="cdx"><option value="">Select…</option>${DX.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(d=>`<option value="${d.id}" ${dx===d.id?'selected':''}>${esc(d.n)}</option>`).join('')}</select></fieldset>
     <fieldset class="group"><legend>Findings you will report</legend><div class="chk">${DATAITEMS.map(([k,n])=>`<label><input type="checkbox" value="${k}" ${items.has(k)?'checked':''}> ${esc(n)} <span class="small">${isDone(k)?'(have it)':'(not done)'}</span></label>`).join('')}</div></fieldset>
     <fieldset class="group"><legend>Your plan / ask</legend><div class="radio">${plans.map((p,i)=>`<label><input type="radio" name="pl" value="${i}" ${plan===i?'checked':''}> ${esc(p)}</label>`).join('')}</div></fieldset>
     <div class="btns"><button class="btn def" id="go" ${opener!=null&&dx&&plan!=null?'':'disabled'}>Make the Call</button><button class="btn" id="cn">Cancel</button></div>`;
    body.querySelectorAll('input[name=op]').forEach(r=>r.onchange=()=>{ opener=+r.value; draw(); });
    body.querySelectorAll('input[name=pl]').forEach(r=>r.onchange=()=>{ plan=+r.value; draw(); });
    body.querySelector('#cdx').onchange=e=>{ dx=e.target.value; draw(); };
    body.querySelectorAll('.chk input').forEach(cb=>cb.onchange=()=>{ cb.checked?items.add(cb.value):items.delete(cb.value); });
    body.querySelector('#cn').onclick=()=>bg.remove();
    body.querySelector('#go').onclick=()=>{
      const req=c.sbar.data||[]; const chosen=[...items];
      const covered=req.filter(r=>{ const alts=r.split('|'); return chosen.some(k=>k.split('|').some(x=>alts.includes(x))) && alts.some(x=>done(P,x)); });
      const missing=req.filter(r=>!covered.includes(r));
      const fab=chosen.filter(k=>!isDone(k));
      let sc=(opener===0?2:0)+(c.dx.includes(dx)?3:0)+(req.length?3*covered.length/req.length:3)+(plans[plan]===c.sbar.plan?2:0)-(fab.length?2:0);
      sc=Math.max(0,Math.min(10,Math.round(sc*10)/10));
      const fb=[]; if(opener!==0) fb.push('Lead with your concern and working diagnosis, not the story.'); if(!c.dx.includes(dx)) fb.push(`Working diagnosis should have been ${DXN[c.dx[0]]}.`);
      missing.forEach(r=>{ const lab=(DATAITEMS.find(([k])=>k.split('|').some(x=>r.split('|').includes(x)))||[0,r])[1]; fb.push(r.split('|').some(x=>done(P,x))?`You had ${lab} but didn't report it.`:`You hadn't checked ${lab} before calling.`); });
      fab.forEach(k=>fb.push(`You reported ${DATAITEMS.find(x=>x[0]===k)[1]} without having checked it.`));
      if(plans[plan]!==c.sbar.plan) fb.push('Propose a plan rather than waiting to be told; the expected plan was: '+c.sbar.plan);
      if(c.sbar.callNeeded===false) fb.push('This call could have waited for the morning.');
      P.calls.push({id,at:P.t,opener,dx,items:chosen,plan:plans[plan],score:sc,fb});
      bg.remove(); placeOrder(id,true,{called:true}); if(VIEW==='page') renderPage();
    };
  };
  draw();
}

/* ---------- grading ---------- */
function skillOf(cr){ if(cr.dispoAny) return 'Disposition'; const cat=ORD[(cr.any||[])[0]].c; return ['History','Exam','Exam aid'].includes(cat)?'Exam':['Labs','Imaging'].includes(cat)?'Workup':['Medication','Procedure'].includes(cat)?'Management':'Communication'; }
function grade(P){
  const c=P.c, out={crit:[],harm:[]};
  const live=P.orders.filter(o=>o.status!=='cancelled'&&!o.failed);
  const ordersFor=ids=>live.filter(o=>ids.includes(o.id));
  let tot=0, earned=0;
  c.critical.filter(cr=>cr.pts>0).forEach(cr=>{
    const skill=cr.skill||skillOf(cr);
    if(cr.varies){ const os=cr.any?ordersFor(cr.any):[]; out.crit.push({label:cr.label,status:'varies',when:os.length?os[0].at:null,note:'Practice varies — not scored',skill,cr}); return; }
    let status='miss',when=null,note='';
    const examOnly=cr.any && cr.any.every(id=>['History','Exam','Exam aid'].includes(ORD[id].c));
    const ref=(examOnly && P.arrivedAt!=null)? P.arrivedAt : 0;
    if(cr.dispoAny){ if(cr.dispoAny.includes(P.dispo)) status='ok'; }
    else { const os=ordersFor(cr.any);
      if(cr.minCount){ if(os.length>=cr.minCount){ status='ok'; when=os[cr.minCount-1].at; } else if(os.length){ status='late'; note=`Only done ${os.length}×`; when=os[0].at; } }
      else if(os.length){ when=Math.min(...os.map(o=>o.at)); status=(cr.within==null||when-ref<=cr.within)?'ok':'late'; if(status==='late') note=`Done ${elStr(when-ref)} after ${ref?'reaching the patient':'the page'}; target within ${elStr(cr.within)}`; }
      if(status==='ok'&&cr.also){ const missing=cr.also.filter(id=>!live.some(o=>o.id===id)); if(missing.length){ status='late'; note='Partial: also needed '+missing.map(id=>ORD[id].n.split(' (')[0]).join(', '); } } }
    const e=status==='ok'?cr.pts:status==='late'?cr.pts/2:0; tot+=cr.pts; earned+=e;
    out.crit.push({label:cr.label,status,when,note,pts:cr.pts,earned:e,skill,cr});
  });
  out.critFrac=tot?earned/tot:1; out.critScore=Math.round(out.critFrac*40);
  c.harmful.forEach(h=>{ let hit=false; if(h.any&&ordersFor(h.any).length) hit=true; if(h.dispoAny&&h.dispoAny.includes(P.dispo)) hit=true; if(h.check&&h.check(P)) hit=true; if(hit) out.harm.push({label:h.label,why:h.why,pts:h.pts}); });
  const expected=new Set([...c.helpful,...NEUTRAL,...c.critical.flatMap(cr=>[...(cr.any||[]),...(cr.also||[])])]);
  ORDERS.filter(o=>o.c==='Counseling').forEach(o=>expected.add(o.id));
  out.extra=[...new Set(live.map(o=>o.id))].filter(id=>!expected.has(id)&&!c.harmful.some(h=>h.any&&h.any.includes(id))&&!CALLS.includes(id));
  out.eff=Math.max(0,5-out.extra.length);
  out.dxOk=c.dx.includes(P.dx); out.dxPts=out.dxOk?15:0;
  out.dispoOk=c.dispo.includes(P.dispo); out.dispoPts=P.dispo===c.bestDispo?10:out.dispoOk?7:0;
  const tr=c.triage, dec=P.triage&&P.triage.decision;
  out.triDec=dec===tr.best?6:(tr.ok||[]).includes(dec)?3:0;
  out.keyAsked=(tr.keyQ||[]).filter(q=>P.asked.includes(q)); out.keyMissed=(tr.keyQ||[]).filter(q=>!P.asked.includes(q));
  out.triQ=(tr.keyQ||[]).length? Math.round(4*out.keyAsked.length/tr.keyQ.length) : 4;
  out.triage=out.triDec+out.triQ;
  const best=P.calls.length? Math.max(...P.calls.map(x=>x.score)) : null;
  out.comm= c.sbar.callNeeded===false ? (best==null?10:Math.max(0,best-2)) : (best==null?0:best);
  const see=c.see||[]; out.obs= see.length? Math.round(5*see.reduce((a,_,i)=>a+((P.quiz[i]&&P.quiz[i].score)||0),0)/see.length*10)/10 : 5;
  out.note=P.note?P.note.score:0;
  out.harmPts=out.harm.reduce((a,h)=>a+h.pts,0); out.evPts=P.penalties.reduce((a,p)=>a+p.pts,0);
  if(NIGHT && P.phoned){
    const base=dec===tr.best?70:(tr.ok||[]).includes(dec)?45:10;
    out.phoned=true; out.total=Math.max(0,Math.min(100,Math.round(base+10*(out.triQ/4)+20*out.critFrac-out.harmPts-out.evPts)));
  } else out.total=Math.max(0,Math.min(100,Math.round(out.critScore+out.dxPts+out.dispoPts+out.triage+out.comm+out.obs+out.note+out.eff-out.harmPts-out.evPts)));
  return out;
}
function finishPatient(P){
  const g=P.result=grade(P), c=P.c, now=Date.now();
  if(!NIGHT){ const prev=DATA.best[c.id]; if(prev==null||g.total>prev) DATA.best[c.id]=g.total; }
  DATA.plays=(DATA.plays||0)+1;
  const push=(k,v)=>{ if(v==null||isNaN(v)) return; (DATA.skh[k]=DATA.skh[k]||[]).push(Math.max(0,Math.min(1,v))); if(DATA.skh[k].length>15) DATA.skh[k].shift(); };
  const bySkill={}; g.crit.filter(k=>k.status!=='varies').forEach(k=>{ (bySkill[k.skill]=bySkill[k.skill]||[0,0]); bySkill[k.skill][0]+=k.earned; bySkill[k.skill][1]+=k.pts; });
  Object.entries(bySkill).forEach(([k,[e,t]])=>push(k,e/t));
  push('Triage',g.triage/10); if((c.see||[]).length&&!g.phoned) push('Observation',g.obs/5); if(!g.phoned){ push('Communication',g.comm/10); push('Documentation',g.note/5); push('Diagnosis',g.dxPts/15); }
  const rev=(key,label,ok,ids)=>{ const r=DATA.rev[key]; if(!ok){ DATA.rev[key]={key,label,caseId:c.id,ids:ids||[],box:0,due:now+DAY,miss:((r&&r.miss)||0)+1}; } else if(r){ r.box++; if(r.box>=4) delete DATA.rev[key]; else r.due=now+[1,3,7,14][r.box]*DAY; } };
  g.crit.filter(k=>k.status!=='varies').forEach(k=>{ rev(c.id+'::'+k.label,k.label,k.status==='ok',k.cr.any);
    if(k.status==='ok') Object.values(DATA.rev).forEach(r=>{ if(r.caseId!==c.id && (r.ids||[]).filter(DISTINCT).some(id=>(k.cr.any||[]).includes(id))){ r.box++; if(r.box>=4) delete DATA.rev[r.key]; else r.due=now+[1,3,7,14][r.box]*DAY; } }); });
  rev(c.id+'::triage','Triage the page (Case '+caseNo(c)+')',g.triDec===6);
  if(!g.phoned){ rev(c.id+'::call','Phone call to your attending (Case '+caseNo(c)+')',g.comm>=7); rev(c.id+'::note','Consult note (Case '+caseNo(c)+')',g.note>=4); }
  save(DATA);
}

}
function renderNightFb(){
  const N=NIGHT; const decName=v=>(TRIAGE_OPTS.find(x=>x[0]===v)||[0,'—'])[1].split(' —')[0];
  app.innerHTML=`<div class="win"><div class="body"><h1 style="font-size:1.4em;color:var(--blue);margin-bottom:8px">Call Night Feedback — ${esc(N.def.title)}</h1>
   <div class="fb"><div>Night score<b>${N.score} / 100</b></div><div>Pages answered<b>${N.pts.length} / ${N.def.pages.length}</b></div><div>Ended at<b>${esc(ccsTime(N.G,{base:N.abs0}).split('@ ')[1])}</b></div></div>
   <div class="sheet" style="min-height:0"><table class="os"><thead><tr><th>Patient</th><th>Paged</th><th>Your response</th><th>Best</th><th>At bedside after</th><th>Score</th><th></th></tr></thead><tbody>
   ${N.pts.map((P,i)=>`<tr><td><b>${esc(P.c.patient.label)}</b><br><span class="small">${esc(DXN[P.c.dx[0]])}</span></td><td>${esc(ccsTime(0,P).split('@ ')[1])}</td><td>${esc(decName(P.triage&&P.triage.decision))}</td><td>${esc(decName(P.c.triage.best))}</td><td>${P.arrivedAt!=null?elStr(P.arrivedAt):P.phoned?'phone':'never'}</td><td><b>${P.result.total}</b>${P.unsigned?' <span class="small">(not signed out)</span>':''}</td><td><button class="btn" data-fb="${i}">Details</button></td></tr>`).join('')}
   </tbody></table></div>
   <fieldset class="group"><legend>What a strong night looks like</legend><p class="small">Ask enough on each page to sort it: the vision, the pressure if they have it, pain and vomiting, trauma or chemicals, recent surgery, blood thinners. Give verbal orders that start treatment before you arrive. Go now for anything that loses vision in minutes to hours (chemical injury, orbital compartment syndrome, angle closure, CRAO, open globe). Handle the near-misses by phone with clear return precautions. Revisit patients whose treatment is working on a clock (pressure rechecks), and sign out as you go.</p></fieldset>
   <div class="row right" style="margin-top:10px"><button class="btn" id="again">Repeat Night</button><button class="btn def" id="home">Case List</button></div></div></div>`;
  app.querySelectorAll('[data-fb]').forEach(b=>b.onclick=()=>{ S=N.pts[+b.dataset.fb]; VIEW='fb'; render(); });
  document.getElementById('again').onclick=()=>startNight(N.def.id);
  document.getElementById('home').onclick=()=>{ NIGHT=null; S=null; VIEW='start'; render(); };
}

render();
</script>
